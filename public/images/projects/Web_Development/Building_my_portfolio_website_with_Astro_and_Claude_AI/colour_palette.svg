<svg viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The seven colours used on the AmweCodex website" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="250" rx="16" fill="#141d2b"/>
  <text x="400" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#cad2e2">The AmweCodex palette</text>

  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">
    <rect x="55"  y="65" width="90" height="100" rx="10" fill="#141d2b" stroke="#4a5466" stroke-width="2"/>
    <rect x="155" y="65" width="90" height="100" rx="10" fill="#1a2331" stroke="#4a5466" stroke-width="2"/>
    <rect x="255" y="65" width="90" height="100" rx="10" fill="#a4b1cd" stroke="#4a5466" stroke-width="2"/>
    <rect x="355" y="65" width="90" height="100" rx="10" fill="#cad2e2" stroke="#4a5466" stroke-width="2"/>
    <rect x="455" y="65" width="90" height="100" rx="10" fill="#1a2332" stroke="#4a5466" stroke-width="2"/>
    <rect x="555" y="65" width="90" height="100" rx="10" fill="#4a5466" stroke="#4a5466" stroke-width="2"/>
    <rect x="655" y="65" width="90" height="100" rx="10" fill="#07E9B4" stroke="#4a5466" stroke-width="2"/>

    <g font-size="13" fill="#cad2e2">
      <text x="100" y="192">Primary bg</text>
      <text x="200" y="192">Secondary bg</text>
      <text x="300" y="192">Text</text>
      <text x="400" y="192">Heading</text>
      <text x="500" y="192">Divider</text>
      <text x="600" y="192">Border</text>
      <text x="700" y="192">Teal</text>
    </g>
    <g font-size="12" fill="#a4b1cd">
      <text x="100" y="212">#141d2b</text>
      <text x="200" y="212">#1a2331</text>
      <text x="300" y="212">#a4b1cd</text>
      <text x="400" y="212">#cad2e2</text>
      <text x="500" y="212">#1a2332</text>
      <text x="600" y="212">#4a5466</text>
      <text x="700" y="212">#07E9B4</text>
    </g>
  </g>
</svg>
