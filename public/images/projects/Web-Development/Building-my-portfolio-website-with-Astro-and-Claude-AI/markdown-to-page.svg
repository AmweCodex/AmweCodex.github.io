<svg viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How a Markdown file becomes a page on the website" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#07E9B4"/>
    </marker>
  </defs>
  <rect width="900" height="230" rx="16" fill="#141d2b"/>
  <text x="450" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#cad2e2">From Markdown file to web page</text>

  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">
    <!-- Box 1 -->
    <rect x="30" y="80" width="180" height="100" rx="12" fill="#1a2331" stroke="#4a5466" stroke-width="2"/>
    <text x="120" y="122" font-size="18" fill="#cad2e2">Markdown file</text>
    <text x="120" y="148" font-size="13" fill="#a4b1cd">a post or project</text>

    <!-- Box 2 -->
    <rect x="250" y="80" width="180" height="100" rx="12" fill="#1a2331" stroke="#4a5466" stroke-width="2"/>
    <text x="340" y="122" font-size="18" fill="#cad2e2">Content collection</text>
    <text x="340" y="148" font-size="13" fill="#a4b1cd">checks the frontmatter</text>

    <!-- Box 3 -->
    <rect x="470" y="80" width="180" height="100" rx="12" fill="#1a2331" stroke="#4a5466" stroke-width="2"/>
    <text x="560" y="122" font-size="18" fill="#cad2e2">Page template</text>
    <text x="560" y="148" font-size="13" fill="#a4b1cd">[...id].astro</text>

    <!-- Box 4 -->
    <rect x="690" y="80" width="180" height="100" rx="12" fill="#1a2331" stroke="#07E9B4" stroke-width="2"/>
    <text x="780" y="122" font-size="18" fill="#07E9B4">Static HTML</text>
    <text x="780" y="148" font-size="13" fill="#a4b1cd">fast, no server needed</text>
  </g>

  <line x1="212" y1="130" x2="246" y2="130" stroke="#07E9B4" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="432" y1="130" x2="466" y2="130" stroke="#07E9B4" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="652" y1="130" x2="686" y2="130" stroke="#07E9B4" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
