<svg viewBox="0 0 900 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Site map: header tabs and the pages they lead to" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#07E9B4"/>
    </marker>
  </defs>
  <rect width="900" height="310" rx="16" fill="#141d2b"/>
  <text x="450" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#cad2e2">How the site is laid out</text>

  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">
    <!-- Header tabs (pills) -->
    <g fill="#1a2331" stroke="#07E9B4" stroke-width="2">
      <rect x="25"  y="60" width="130" height="40" rx="20"/>
      <rect x="205" y="60" width="130" height="40" rx="20"/>
      <rect x="385" y="60" width="130" height="40" rx="20"/>
      <rect x="565" y="60" width="130" height="40" rx="20"/>
      <rect x="745" y="60" width="130" height="40" rx="20"/>
    </g>
    <g font-size="16" fill="#cad2e2">
      <text x="90"  y="86">Home</text>
      <text x="270" y="86">About</text>
      <text x="450" y="86">Projects</text>
      <text x="630" y="86">Blog</text>
      <text x="810" y="86">Contact</text>
    </g>

    <!-- Connectors from tabs to first-level boxes -->
    <g stroke="#4a5466" stroke-width="2">
      <line x1="90"  y1="100" x2="90"  y2="130"/>
      <line x1="270" y1="100" x2="270" y2="130"/>
      <line x1="450" y1="100" x2="450" y2="130"/>
      <line x1="630" y1="100" x2="630" y2="130"/>
      <line x1="810" y1="100" x2="810" y2="130"/>
    </g>

    <!-- First level boxes -->
    <g fill="#1a2331" stroke="#4a5466" stroke-width="2">
      <rect x="15"  y="130" width="150" height="56" rx="10"/>
      <rect x="195" y="130" width="150" height="56" rx="10"/>
      <rect x="375" y="130" width="150" height="56" rx="10"/>
      <rect x="555" y="130" width="150" height="56" rx="10"/>
      <rect x="735" y="130" width="150" height="56" rx="10"/>
    </g>
    <g font-size="13" fill="#a4b1cd">
      <text x="90"  y="163">3 latest projects</text>
      <text x="270" y="163">Skills cards</text>
      <text x="450" y="163">Listing by category</text>
      <text x="630" y="163">Listing by topic</text>
      <text x="810" y="163">Socials and email</text>
    </g>

    <!-- Second level boxes -->
    <g fill="#1a2331" stroke="#4a5466" stroke-width="2">
      <rect x="15"  y="222" width="150" height="56" rx="10"/>
      <rect x="375" y="222" width="150" height="56" rx="10" stroke="#07E9B4"/>
      <rect x="555" y="222" width="150" height="56" rx="10" stroke="#07E9B4"/>
    </g>
    <g font-size="13" fill="#a4b1cd">
      <text x="90"  y="255">3 latest posts</text>
      <text x="450" y="255">Project detail page</text>
      <text x="630" y="255">Post detail page</text>
    </g>
  </g>

  <!-- Arrows from listing to detail -->
  <line x1="450" y1="188" x2="450" y2="218" stroke="#07E9B4" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="630" y1="188" x2="630" y2="218" stroke="#07E9B4" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="90"  y1="188" x2="90"  y2="218" stroke="#4a5466" stroke-width="2"/>
</svg>
