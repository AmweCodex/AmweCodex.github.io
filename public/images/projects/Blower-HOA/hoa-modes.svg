<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="t1 d1" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t1">The three HOA modes</title><desc id="d1">OFF keeps the blower off. HAND runs the blower straight away. AUTO runs the blower only when the auto energize bit is on.</desc><defs></defs><style>
text{font-family:'Segoe UI',Arial,sans-serif}
.h{font-size:18px;font-weight:700;fill:#cad2e2}
.b{font-size:15px;font-weight:700;fill:#cad2e2}
.s{font-size:13px;fill:#a4b1cd}
.m{font-size:14px;fill:#cad2e2}
.mn{font-size:11.5px;font-weight:700;letter-spacing:1.2px}
.mono{font-family:'Consolas','Courier New',monospace;font-size:15px;font-weight:700;fill:#cad2e2}
</style><rect width="900" height="330" rx="16" fill="#141d2b"/><rect x="20" y="20" width="280" height="290" rx="14" fill="#1a2331" stroke="#4a5466"/><text x="160" y="62" class="h" text-anchor="middle" style="font-size:28px;fill:#a4b1cd">OFF</text><text x="160" y="86" class="s" text-anchor="middle" >N7:0 = 0</text><circle cx="160" cy="160" r="40" fill="none" stroke="#4a5466" stroke-width="3"/><ellipse cx="0" cy="-20" rx="10" ry="19" fill="#4a5466" opacity=".9" transform="translate(160 160) rotate(0)"/><ellipse cx="0" cy="-20" rx="10" ry="19" fill="#4a5466" opacity=".9" transform="translate(160 160) rotate(120)"/><ellipse cx="0" cy="-20" rx="10" ry="19" fill="#4a5466" opacity=".9" transform="translate(160 160) rotate(240)"/><circle cx="160" cy="160" r="6" fill="#141d2b" stroke="#4a5466" stroke-width="2"/><text x="160" y="236" class="b" text-anchor="middle" >Blower stays OFF</text><text x="160" y="258" class="s" text-anchor="middle" >Nothing can start it</text><rect x="70" y="272" width="180" height="26" rx="13" fill="#141d2b" stroke="#4a5466"/><text x="160" y="290" class="s" text-anchor="middle" >Selected by OFF PB</text><rect x="320" y="20" width="280" height="290" rx="14" fill="#1a2331" stroke="#4a5466"/><text x="460" y="62" class="h" text-anchor="middle" style="font-size:28px;fill:#07E9B4">HAND</text><text x="460" y="86" class="s" text-anchor="middle" >N7:0 = 1</text><circle cx="460" cy="160" r="40" fill="none" stroke="#07E9B4" stroke-width="3"/><ellipse cx="0" cy="-20" rx="10" ry="19" fill="#07E9B4" opacity=".9" transform="translate(460 160) rotate(0)"/><ellipse cx="0" cy="-20" rx="10" ry="19" fill="#07E9B4" opacity=".9" transform="translate(460 160) rotate(120)"/><ellipse cx="0" cy="-20" rx="10" ry="19" fill="#07E9B4" opacity=".9" transform="translate(460 160) rotate(240)"/><circle cx="460" cy="160" r="6" fill="#141d2b" stroke="#07E9B4" stroke-width="2"/><text x="460" y="236" class="b" text-anchor="middle" >Blower runs now</text><text x="460" y="258" class="s" text-anchor="middle" >No conditions needed</text><rect x="370" y="272" width="180" height="26" rx="13" fill="#141d2b" stroke="#4a5466"/><text x="460" y="290" class="s" text-anchor="middle" >Selected by HAND PB</text><rect x="620" y="20" width="280" height="290" rx="14" fill="#1a2331" stroke="#4a5466"/><text x="760" y="62" class="h" text-anchor="middle" style="font-size:28px;fill:#f5b942">AUTO</text><text x="760" y="86" class="s" text-anchor="middle" >N7:0 = 2</text><circle cx="760" cy="160" r="40" fill="none" stroke="#f5b942" stroke-width="3" stroke-dasharray="6 5"/><ellipse cx="0" cy="-20" rx="10" ry="19" fill="#f5b942" opacity=".9" transform="translate(760 160) rotate(0)"/><ellipse cx="0" cy="-20" rx="10" ry="19" fill="#f5b942" opacity=".9" transform="translate(760 160) rotate(120)"/><ellipse cx="0" cy="-20" rx="10" ry="19" fill="#f5b942" opacity=".9" transform="translate(760 160) rotate(240)"/><circle cx="760" cy="160" r="6" fill="#141d2b" stroke="#f5b942" stroke-width="2"/><text x="760" y="236" class="b" text-anchor="middle" >Runs only when the</text><text x="760" y="258" class="s" text-anchor="middle" >auto energize bit is 1</text><rect x="670" y="272" width="180" height="26" rx="13" fill="#141d2b" stroke="#4a5466"/><text x="760" y="290" class="s" text-anchor="middle" >Selected by AUTO PB</text></svg>