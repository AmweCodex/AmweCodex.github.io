<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="Input and output flow" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Input and output flow</title><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#07E9B4"/></marker><marker id="aa" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f5b942"/></marker></defs><rect width="900" height="360" rx="16" fill="#141d2b"/><text x="450" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#cad2e2" text-anchor="middle" font-weight="bold">Input and output flow</text><rect x="30" y="70" width="220" height="230" rx="12" fill="#1a2331" stroke="#4a5466" stroke-width="1.5"/><text x="140" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#a4b1cd" text-anchor="middle" font-weight="bold">PHYSICAL INPUTS</text><rect x="50" y="115" width="180" height="70" rx="12" fill="#1a2331" stroke="#07E9B4" stroke-width="1.5"/><text x="140" y="143" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#cad2e2" text-anchor="middle" font-weight="normal">START button</text><text x="140" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#07E9B4" text-anchor="middle" font-weight="bold">I:1/0</text><rect x="50" y="205" width="180" height="70" rx="12" fill="#1a2331" stroke="#f5b942" stroke-width="1.5"/><text x="140" y="233" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#cad2e2" text-anchor="middle" font-weight="normal">STOP button</text><text x="140" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#f5b942" text-anchor="middle" font-weight="bold">I:1/1</text><rect x="340" y="70" width="220" height="230" rx="12" fill="#1a2331" stroke="#4a5466" stroke-width="1.5"/><text x="450" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#a