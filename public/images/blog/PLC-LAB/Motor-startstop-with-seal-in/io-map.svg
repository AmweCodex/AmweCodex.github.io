<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="Input and output map" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Input and output map</title>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#07E9B4"/></marker>
<marker id="aa" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f5b942"/></marker></defs>
<rect width="900" height="400" rx="16" fill="#141d2b"/>
<text x="450" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#cad2e2" text-anchor="middle" font-weight="bold">Step 2  •  Input / Output map</text><rect x="40" y="80" width="230" height="260" rx="12" fill="#1a2331" stroke="#4a5466" stroke-width="1.5"/><text x="155" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#a4b1cd" text-anchor="middle" font-weight="bold">FIELD INPUTS</text><rect x="60" y="130" width="190" height="80" rx="12" fill="#1a2331" stroke="#07E9B4" stroke-width="1.5"/><text x="155" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#cad2e2" text-anchor="middle" font-weight="normal">START pushbutton</text><text x="155" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#07E9B4" text-anchor="middle" font-weight="normal">I:1/0  (1762-IQ8)</text><text x="155" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#a4b1cd" text-anchor="middle" font-weight="normal">Normally open</text><rect x="60" y="230" width="190" height="80" rx="12" fill="#1a2331" stroke="#f5b942" stroke-width="1.5"/><text x="155" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#cad2e2" text-anchor="middle" font-weight="normal">STOP pushbutton</text><text x="155" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#f5b942" text-anchor="middle" font-weight="normal">I:1/1  (1762-IQ8)</text><text x="155" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#a4b1cd" text-anchor="middle" font-weight="normal">1 = STOP pressed</text><rect x="330" y="80" width="240" height="260" rx="12" fill="#1a2331" stroke="#4a5466" stroke-width="1.5"/><text x="450" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#a4b1cd" text-anchor="middle" font-weight="bold">PLC  (RSLogix 500)</text><rect x="350" y="130" width="200" height="48" rx="12" fill="#1a2331" stroke="#4a5466" stroke-width="1.5"/><text x="450" y="159" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#cad2e2" text-anchor="middle" font-weight="normal">B3:0/0  START_PB</text><rect x="350" y="190" width="200" height="48" rx="12" fill="#1a2331" stroke="#4a5466" stroke-width="1.5"/><text x="450" y="219" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#cad2e2" text-anchor="middle" font-weight="normal">B3:0/1  STOP_PB</text><rect x="350" y="250" width="200" height="64" rx="12" fill="#1a2331" stroke="#07E9B4" stroke-width="1.5"/><text x="450" y="277" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#07E9B4" text-anchor="middle" font-weight="bold">B3:0/2  MOTOR</text><text x="450" y="298" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#a4b1cd" text-anchor="middle" font-weight="normal">seal-in memory bit</text><rect x="630" y="80" width="230" height="260" rx="12" fill="#1a2331" stroke="#4a5466" stroke-width="1.5"/><text x="745" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#a4b1cd" text-anchor="middle" font-weight="bold">FIELD OUTPUT</text><rect x="650" y="170" width="190" height="110" rx="12" fill="#1a2331" stroke="#07E9B4" stroke-width="1.5"/><text x="745" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#cad2e2" text-anchor="middle" font-weight="normal">Conveyor motor</text><text x="745" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#07E9B4" text-anchor="middle" font-weight="normal">O:2/0  (1762-OW8)</text><text x="745" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#a4b1cd" text-anchor="middle" font-weight="normal">1 = motor running</text><line x1="250" y1="170" x2="348" y2="160" stroke="#07E9B4" stroke-width="2.5" marker-end="url(#ar)"/><line x1="250" y1="270" x2="348" y2="230" stroke="#07E9B4" stroke-width="2.5" marker-end="url(#ar)"/><line x1="552" y1="282" x2="648" y2="230" stroke="#07E9B4" stroke-width="2.5" marker-end="url(#ar)"/><text x="450" y="372" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#a4b1cd" text-anchor="middle" font-weight="normal">Physical inputs are copied to internal bits first (DIGITAL IO), the logic runs on the bits (CONTROLS), then the MOTOR bit drives the output.</text>
</svg>