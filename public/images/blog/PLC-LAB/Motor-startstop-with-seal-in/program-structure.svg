<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-label="Program structure" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Program structure</title>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#07E9B4"/></marker>
<marker id="aa" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f5b942"/></marker></defs>
<rect width="900" height="370" rx="16" fill="#141d2b"/>
<text x="450" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#cad2e2" text-anchor="middle" font-weight="bold">Step 4  •  Program structure</text><rect x="40" y="90" width="250" height="220" rx="12" fill="#1a2331" stroke="#07E9B4" stroke-width="1.5"/><text x="165" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#07E9B4" text-anchor="middle" font-weight="bold">LAD 2 – MAIN</text><rect x="60" y="140" width="210" height="50" rx="12" fill="#1a2331" stroke="#4a5466" stroke-width="1.5"/><text x="165" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#cad2e2" text-anchor="middle" font-weight="normal">0000  JSR  U:3</text><rect x="60" y="200" width="210" height="50" rx="12" fill="#1a2331" stroke="#4a5466" stroke-width="1.5"/><text x="165" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#cad2e2" text-anchor="middle" font-weight="normal">0001  JSR  U:4</text><rect x="60" y="260" width="210" height="36" rx="12" fill="#1a2331" stroke="#4a5466" stroke-width="1.5"/><text x="165" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#a4b1cd" text-anchor="middle" font-weight="normal">0002  END</text><rect x="430" y="90" width="430" height="100" rx="12" fill="#1a2331" stroke="#4a5466" stroke-width="1.5"/><text x="645" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#cad2e2" text-anchor="middle" font-weight="bold">LAD 3 – DIGITAL IO   (U:3)</text><text x="645" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#a4b1cd" text-anchor="middle" font-weight="normal">Inputs → internal bits   •   MOTOR bit → output</text><text x="645" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#f5b942" text-anchor="middle" font-weight="normal">3 rungs + END</text><rect x="430" y="210" width="430" height="100" rx="12" fill="#1a2331" stroke="#4a5466" stroke-width="1.5"/><text x="645" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#cad2e2" text-anchor="middle" font-weight="bold">LAD 4 – CONTROLS   (U:4)</text><text x="645" y="265" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#a4b1cd" text-anchor="middle" font-weight="normal">Start / stop / seal-in logic on B3:0 bits</text><text x="645" y="288" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#f5b942" text-anchor="middle" font-weight="normal">1 rung + END</text><path d="M272,165 L430,140" stroke="#07E9B4" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><path d="M272,225 L430,260" stroke="#07E9B4" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><text x="350" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#f5b942" text-anchor="start" font-weight="normal">1st</text><text x="350" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#f5b942" text-anchor="start" font-weight="normal">2nd</text><text x="450" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#a4b1cd" text-anchor="middle" font-weight="normal">Each scan: MAIN calls DIGITAL IO, then CONTROLS, and then ends.</text>
</svg>