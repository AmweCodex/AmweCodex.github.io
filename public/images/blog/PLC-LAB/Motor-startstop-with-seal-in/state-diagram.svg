<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="State diagram" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>State diagram</title>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#07E9B4"/></marker>
<marker id="aa" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f5b942"/></marker></defs>
<rect width="900" height="360" rx="16" fill="#141d2b"/>
<text x="450" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#cad2e2" text-anchor="middle" font-weight="bold">Step 3  •  State diagram</text><circle cx="220" cy="190" r="80" fill="#1a2331" stroke="#4a5466" stroke-width="3"/><text x="220" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#cad2e2" text-anchor="middle" font-weight="bold">STOPPED</text><text x="220" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#a4b1cd" text-anchor="middle" font-weight="normal">MOTOR = 0</text><circle cx="680" cy="190" r="80" fill="#1a2331" stroke="#07E9B4" stroke-width="3"/><text x="680" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#07E9B4" text-anchor="middle" font-weight="bold">RUNNING</text><text x="680" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#a4b1cd" text-anchor="middle" font-weight="normal">MOTOR = 1 (sealed in)</text><path d="M290,150 C400,70 500,70 612,150" stroke="#07E9B4" stroke-width="3" fill="none" marker-end="url(#ar)"/><text x="450" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#07E9B4" text-anchor="middle" font-weight="bold">START pressed</text><text x="450" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#a4b1cd" text-anchor="middle" font-weight="normal">AND STOP not pressed</text><path d="M612,232 C500,320 400,320 290,232" stroke="#f5b942" stroke-width="3" fill="none" marker-end="url(#aa)"/><text x="450" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#f5b942" text-anchor="middle" font-weight="bold">STOP pressed</text><text x="450" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#a4b1cd" text-anchor="middle" font-weight="normal">(any START state – STOP has priority)</text><path d="M740,120 C790,60 850,110 800,150" stroke="#07E9B4" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><text x="805" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#a4b1cd" text-anchor="middle" font-weight="normal">START released:</text><text x="805" y="86" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#a4b1cd" text-anchor="middle" font-weight="normal">stays RUNNING</text><path d="M160,120 C110,60 50,110 100,150" stroke="#4a5466" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><text x="95" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#a4b1cd" text-anchor="middle" font-weight="normal">No START:</text><text x="95" y="86" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#a4b1cd" text-anchor="middle" font-weight="normal">stays STOPPED</text>
</svg>