<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" role="img" aria-label="Program organisation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Program organisation</title><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#07E9B4"/></marker><marker id="aa" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f5b942"/></marker></defs><rect width="900" height="270" rx="16" fill="#141d2b"/><text x="450" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#cad2e2" text-anchor="middle" font-weight="bold">How the program is organised</text><rect x="40" y="80" width="220" height="120" rx="12" fill="#1a2331" stroke="#4a5466" stroke-width="1.5"/><text x="150" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#cad2e2" text-anchor="middle" font-weight="bold">MAIN</text><text x="150" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#a4b1cd" text-anchor="middle" font-weight="normal">calls the two files in order</text><line x1="262" y1="140" x2="338" y2="140" stroke="#07E9B4" stroke-width="3" marker-end="url(#ar)"/><rect x="340" y="80" width="220" height="120" rx="12" fill="#1a2331" stroke="#4a5466" stroke-width="1.5"/><text x="450" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#cad2e2" text-anchor="middle" font-weight="bold">DIGITAL_IO</text><text x="450" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#a4b1cd" text-anchor="middle" font-weight="normal">physical I/O ⇄ internal bits</text><line x1="562" y1="140" x2="638" y2="140" stroke="#07E9B4" stroke-width="3" marker-end="url(#ar)"/><rect x="640" y="80" width="220" height="120" rx="12" fill="#1a2331" stroke="#07E9B4" stroke-width="1.5"/><text x="750" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#07E9B4" text-anchor="middle" font-weight="bold">CONTROLS</text><text x="750" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#a4b1cd" text-anchor="middle" font-weight="normal">start, stop and seal-in logic</text><text x="450" y="245" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#a4b1cd" text-anchor="middle" font-weight="normal">1st: map inputs   →   2nd: run the logic   →   motor output follows on the next scan</text></svg>