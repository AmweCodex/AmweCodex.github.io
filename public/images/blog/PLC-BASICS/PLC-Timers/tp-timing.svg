<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t4 d4" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t4">TP pulse timer timing</title><desc id="d4">A rising edge on the input starts a pulse that lasts exactly PT. The input length does not matter, and presses during the pulse are ignored.</desc><defs></defs><style>
text{font-family:'Segoe UI',Arial,sans-serif}
.h{font-size:18px;font-weight:700;fill:#cad2e2}
.b{font-size:15px;font-weight:700;fill:#cad2e2}
.s{font-size:13px;fill:#a4b1cd}
.m{font-size:14px;fill:#cad2e2}
.mn{font-size:11.5px;font-weight:700;letter-spacing:1.2px}
.mono{font-family:'Consolas','Courier New',monospace;font-size:15px;font-weight:700;fill:#cad2e2}
</style><rect width="900" height="380" rx="16" fill="#141d2b"/><path d="M260 30V330" stroke="#4a5466" stroke-width="1.5" stroke-dasharray="5 5"/><path d="M380 30V330" stroke="#4a5466" stroke-width="1.5" stroke-dasharray="5 5"/><path d="M560 30V330" stroke="#4a5466" stroke-width="1.5" stroke-dasharray="5 5"/><path d="M680 30V330" stroke="#4a5466" stroke-width="1.5" stroke-dasharray="5 5"/><text x="24" y="80.0" class="b" text-anchor="start" >IN</text><text x="24" y="100.0" class="s" text-anchor="start" >your input</text><path d="M200 96H860" stroke="#4a5466" stroke-width="1" opacity=".6"/><text x="24" y="178.0" class="b" text-anchor="start" >ET</text><text x="24" y="198.0" class="s" text-anchor="start" >elapsed time</text><path d="M200 206H860" stroke="#4a5466" stroke-width="1" opacity=".6"/><text x="24" y="280.0" class="b" text-anchor="start" >Q</text><text x="24" y="300.0" class="s" text-anchor="start" >pulse output</text><path d="M200 296H860" stroke="#4a5466" stroke-width="1" opacity=".6"/><path d="M200 96H260V60H520V96H560V60H580V96H610V60H630V96H860" fill="none" stroke="#a4b1cd" stroke-width="3.5" stroke-linejoin="round"/><path d="M200 206H260L380 146H520V206H560L680 146V206H860" fill="none" stroke="#07E9B4" stroke-width="3.5" stroke-linejoin="round"/><path d="M200 146H860" stroke="#f5b942" stroke-width="1.5" stroke-dasharray="6 5"/><text x="856" y="140" class="s" text-anchor="end" style="fill:#f5b942">PT</text><path d="M200 296H260V260H380V296H560V260H680V296H860" fill="none" stroke="#f5b942" stroke-width="3.5" stroke-linejoin="round"/><text x="450" y="238" class="s" text-anchor="middle" >IN stays on, pulse still ends after PT</text><text x="620" y="332" class="s" text-anchor="middle" >second press during the pulse is ignored</text><text x="320" y="352" class="s" text-anchor="middle" style="fill:#f5b942">pulse = PT</text></svg>