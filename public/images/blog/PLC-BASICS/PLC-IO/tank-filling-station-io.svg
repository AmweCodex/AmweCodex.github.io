<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t6 d6" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t6">IO for a tank filling station</title>
<desc id="d6">Three inputs (start button, stop button, level transmitter) go into a PLC. Three outputs (pump contactor, run lamp, inlet valve positioner) come out.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#07E9B4"/></marker>
</defs>
<style>
text{font-family:'Segoe UI',Arial,sans-serif}
.h{fill:#a4b1cd;font-size:12.5px;letter-spacing:1.5px}
.b{fill:#cad2e2;font-size:15px;font-weight:700}
.s{fill:#a4b1cd;font-size:12.5px}
.k{font-size:12px;font-weight:700}
</style>
<rect width="900" height="430" rx="16" fill="#141d2b"/>
<text x="20" y="38" class="h">INPUTS · field → PLC</text>
<text x="880" y="38" class="h" text-anchor="end">OUTPUTS · PLC → field</text>

<g>
<rect x="20" y="60" width="290" height="72" rx="10" fill="#1a2331" stroke="#4a5466"/><text x="38" y="90" class="b">Start push button</text><text x="38" y="112" class="s">Digital input · 0V / 24V</text>
<rect x="262" y="76" width="36" height="24" rx="12" fill="#07E9B4" opacity=".18"/><text x="280" y="93" class="k" fill="#07E9B4" text-anchor="middle">DI</text>

<rect x="20" y="160" width="290" height="72" rx="10" fill="#1a2331" stroke="#4a5466"/><text x="38" y="190" class="b">Stop push button</text><text x="38" y="212" class="s">Digital input · 0V / 24V</text>
<rect x="262" y="176" width="36" height="24" rx="12" fill="#07E9B4" opacity=".18"/><text x="280" y="193" class="k" fill="#07E9B4" text-anchor="middle">DI</text>

<rect x="20" y="260" width="290" height="72" rx="10" fill="#1a2331" stroke="#4a5466"/><text x="38" y="290" class="b">Level transmitter</text><text x="38" y="312" class="s">Analog input · 4-20mA</text>
<rect x="262" y="276" width="36" height="24" rx="12" fill="#f5b942" opacity=".18"/><text x="280" y="293" class="k" fill="#f5b942" text-anchor="middle">AI</text>
</g>

<rect x="380" y="60" width="140" height="272" rx="14" fill="#1a2331" stroke="#07E9B4" stroke-width="2.5"/>
<text x="450" y="188" class="b" text-anchor="middle" fill="#07E9B4" style="font-size:20px">PLC</text>
<text x="450" y="212" class="s" text-anchor="middle">decides what to do</text>

<g>
<rect x="590" y="60" width="290" height="72" rx="10" fill="#1a2331" stroke="#4a5466"/><text x="608" y="90" class="b">Pump contactor</text><text x="608" y="112" class="s">Digital output · pump ON / OFF</text>
<rect x="832" y="76" width="36" height="24" rx="12" fill="#07E9B4" opacity=".18"/><text x="850" y="93" class="k" fill="#07E9B4" text-anchor="middle">DO</text>

<rect x="590" y="160" width="290" height="72" rx="10" fill="#1a2331" stroke="#4a5466"/><text x="608" y="190" class="b">Green run lamp</text><text x="608" y="212" class="s">Digital output · lit while running</text>
<rect x="832" y="176" width="36" height="24" rx="12" fill="#07E9B4" opacity=".18"/><text x="850" y="193" class="k" fill="#07E9B4" text-anchor="middle">DO</text>

<rect x="590" y="260" width="290" height="72" rx="10" fill="#1a2331" stroke="#4a5466"/><text x="608" y="290" class="b">Inlet valve positioner</text><text x="608" y="312" class="s">Analog output · 4-20mA</text>
<rect x="832" y="276" width="36" height="24" rx="12" fill="#f5b942" opacity=".18"/><text x="850" y="293" class="k" fill="#f5b942" text-anchor="middle">AO</text>
</g>

<g stroke="#07E9B4" stroke-width="2.5">
<path d="M310 96H378" marker-end="url(#a)"/><path d="M310 196H378" marker-end="url(#a)"/><path d="M310 296H378" marker-end="url(#a)"/>
<path d="M520 96H588" marker-end="url(#a)"/><path d="M520 196H588" marker-end="url(#a)"/><path d="M520 296H588" marker-end="url(#a)"/>
</g>

<rect x="20" y="376" width="14" height="14" rx="4" fill="#07E9B4"/><text x="42" y="388" class="s">Digital (DI / DO): two states</text>
<rect x="260" y="376" width="14" height="14" rx="4" fill="#f5b942"/><text x="282" y="388" class="s">Analog (AI / AO): continuous range</text>
</svg>
