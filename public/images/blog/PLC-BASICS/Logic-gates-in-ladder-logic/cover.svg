<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-label="Cover: logic gates in ladder logic" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Cover: logic gates in ladder logic</title><rect width="900" height="410" rx="16" fill="#141d2b"/><text x="450" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="40" fill="#cad2e2" text-anchor="middle" font-weight="bold">Logic Gates in Ladder Logic</text><text x="450" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#a4b1cd" text-anchor="middle" font-weight="normal">AND  •  OR  •  NOT  •  NAND  •  NOR  •  XOR  •  XNOR   |   RSLogix 500</text><rect x="60" y="140" width="780" height="200" rx="12" fill="#1a2331" stroke="#4a5466" stroke-width="1.5"/><line x1="100" y1="160" x2="100" y2="320" stroke="#a4b1cd" stroke-width="3"/><line x1="800" y1="160" x2="800" y2="320" stroke="#a4b1cd" stroke-width="3"/><line x1="100" y1="220" x2="200" y2="220" stroke="#a4b1cd" stroke-width="3"/><line x1="218" y1="210" x2="218" y2="230" stroke="#cad2e2" stroke-width="2.5"/><line x1="230" y1="210" x2="230" y2="230" stroke="#cad2e2" stroke-width="2.5"/><text x="224" y="204" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#a4b1cd" text-anchor="middle" font-weight="normal">A</text><line x1="238" y1="220" x2="300" y2="220" stroke="#a4b1cd" stroke-width="3"/><line x1="318" y1="210" x2="318" y2="230" stroke="#cad2e2" stroke-width="2.5"/><line x1="330" y1="210" x2="330" y2="230" stroke="#cad2e2" stroke-width="2.5"/><text x="324" y="204" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#a4b1cd" text-anchor="middle" font-weight="normal">B</text><line x1="338" y1="220" x2="640" y2="220" stroke="#a4b1cd" stroke-width="3"/><circle cx="670" cy="220" r="11" fill="none" stroke="#07E9B4" stroke-width="2.5"/><text x="670" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#a4b1cd" text-anchor="middle" font-weight="