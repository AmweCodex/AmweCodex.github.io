<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" aria-labelledby="t1 d1" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t1">The five core ladder instructions</title><desc id="d1">XIC, XIO, OTE, OTL and OTU shown as ladder symbols with a one-line meaning each.</desc><defs></defs><style>
text{font-family:'Segoe UI',Arial,sans-serif}
.h{font-size:18px;font-weight:700;fill:#cad2e2}
.b{font-size:15px;font-weight:700;fill:#cad2e2}
.s{font-size:13px;fill:#a4b1cd}
.m{font-size:14px;fill:#cad2e2}
.mn{font-size:11.5px;font-weight:700;letter-spacing:1.2px}
.mono{font-family:'Consolas','Courier New',monospace;font-size:15px;font-weight:700;fill:#cad2e2}
</style><rect width="900" height="310" rx="16" fill="#141d2b"/><rect x="20" y="20" width="164" height="270" rx="12" fill="#1a2331" stroke="#4a5466"/><text x="102" y="48" class="mn" text-anchor="middle" fill="#07E9B4">INPUT</text><path d="M32 100L92 100" stroke="#a4b1cd" stroke-width="2.5" fill="none"/><path d="M112 100L172 100" stroke="#a4b1cd" stroke-width="2.5" fill="none"/><path d="M92 80V120M112 80V120" stroke="#07E9B4" stroke-width="3.5" fill="none"/><text x="102" y="178" class="h" text-anchor="middle" style="font-size:26px;fill:#07E9B4">XIC</text><text x="102" y="204" class="m" text-anchor="middle" >Examine If Closed</text><text x="102" y="238" class="s" text-anchor="middle" >TRUE when bit = 1</text><text x="102" y="258" class="s" text-anchor="middle" >like a NO contact</text><rect x="196" y="20" width="164" height="270" rx="12" fill="#1a2331" stroke="#4a5466"/><text x="278" y="48" class="mn" text-anchor="middle" fill="#07E9B4">INPUT</text><path d="M208 100L268 100" stroke="#a4b1cd" stroke-width="2.5" fill="none"/><path d="M288 100L348 100" stroke="#a4b1cd" stroke-width="2.5" fill="none"/><path d="M268 80V120M288 80V120" stroke="#07E9B4" stroke-width="3.5" fill="none"/><path d="M262 116L294 84" stroke="#07E9B4" stroke-width="3" fill="none"/><text x="278" y="178" class="h" text-anchor="middle" style="font-size:26px;fill:#07E9B4">XIO</text><text x="278" y="204" class="m" text-anchor="middle" >Examine If Open</text><text x="278" y="238" class="s" text-anchor="middle" >TRUE when bit = 0</text><text x="278" y="258" class="s" text-anchor="middle" >like a NC contact</text><rect x="372" y="20" width="164" height="270" rx="12" fill="#1a2331" stroke="#4a5466"/><text x="454" y="48" class="mn" text-anchor="middle" fill="#f5b942">OUTPUT</text><path d="M384 100L438 100" stroke="#a4b1cd" stroke-width="2.5" fill="none"/><path d="M470 100L524 100" stroke="#a4b1cd" stroke-width="2.5" fill="none"/><path d="M446 80Q428 100 446 120M462 80Q480 100 462 120" stroke="#f5b942" stroke-width="3.5" fill="none"/><text x="454" y="178" class="h" text-anchor="middle" style="font-size:26px;fill:#f5b942">OTE</text><text x="454" y="204" class="m" text-anchor="middle" >Output Energize</text><text x="454" y="238" class="s" text-anchor="middle" >follows the rung</text><text x="454" y="258" class="s" text-anchor="middle" >no memory</text><rect x="548" y="20" width="164" height="270" rx="12" fill="#1a2331" stroke="#4a5466"/><text x="630" y="48" class="mn" text-anchor="middle" fill="#f5b942">OUTPUT</text><path d="M560 100L614 100" stroke="#a4b1cd" stroke-width="2.5" fill="none"/><path d="M646 100L700 100" stroke="#a4b1cd" stroke-width="2.5" fill="none"/><path d="M622 80Q604 100 622 120M638 80Q656 100 638 120" stroke="#f5b942" stroke-width="3.5" fill="none"/><text x="630" y="106" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#f5b942">L</text><text x="630" y="178" class="h" text-anchor="middle" style="font-size:26px;fill:#f5b942">OTL</text><text x="630" y="204" class="m" text-anchor="middle" >Output Latch</text><text x="630" y="238" class="s" text-anchor="middle" >sets the bit to 1</text><text x="630" y="258" class="s" text-anchor="middle" >and holds it</text><rect x="724" y="20" width="164" height="270" rx="12" fill="#1a2331" stroke="#4a5466"/><text x="806" y="48" class="mn" text-anchor="middle" fill="#f5b942">OUTPUT</text><path d="M736 100L790 100" stroke="#a4b1cd" stroke-width="2.5" fill="none"/><path d="M822 100L876 100" stroke="#a4b1cd" stroke-width="2.5" fill="none"/><path d="M798 80Q780 100 798 120M814 80Q832 100 814 120" stroke="#f5b942" stroke-width="3.5" fill="none"/><text x="806" y="106" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#f5b942">U</text><text x="806" y="178" class="h" text-anchor="middle" style="font-size:26px;fill:#f5b942">OTU</text><text x="806" y="204" class="m" text-anchor="middle" >Output Unlatch</text><text x="806" y="238" class="s" text-anchor="middle" >clears the bit to 0</text><text x="806" y="258" class="s" text-anchor="middle" >and holds it</text></svg>