<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t4 d4" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t4">4-20mA signal mapped to 0-10 bar</title>
<desc id="d4">A straight line from 4mA (0 bar) to 20mA (10 bar). The area below 4mA is a fault zone. A marked point shows 12mA equals 50 percent, or 5 bar.</desc>
<style>
text{font-family:'Segoe UI',Arial,sans-serif}
.h{font-size:18px;font-weight:700;fill:#cad2e2}
.l{fill:#a4b1cd;font-size:13px}
.ax{stroke:#4a5466;stroke-width:1.5;fill:none}
.gr{stroke:#4a5466;stroke-width:1;stroke-dasharray:4 5;opacity:.6}
</style>
<rect width="800" height="380" rx="16" fill="#141d2b"/>
<text x="400" y="36" class="h" text-anchor="middle">4-20mA → 0-10 bar pressure</text>

<rect x="120" y="70" width="124" height="230" fill="#ec0725" opacity=".13"/>
<text x="182" y="110" class="l" text-anchor="middle" style="fill:#ec0725;font-weight:700">FAULT ZONE</text>
<text x="182" y="130" class="l" text-anchor="middle">below 4mA</text>
<text x="182" y="148" class="l" text-anchor="middle">(broken wire)</text>

<line class="gr" x1="120" y1="70" x2="740" y2="70"/>
<line class="gr" x1="120" y1="185" x2="740" y2="185"/>
<path class="ax" d="M120 60V300H750"/>

<path d="M244 300L740 70" stroke="#f5b942" stroke-width="4" stroke-linecap="round"/>
<path d="M120 300H244" stroke="#ec0725" stroke-width="3" stroke-dasharray="6 5"/>

<path d="M492 185H120M492 185V300" stroke="#07E9B4" stroke-width="1.5" stroke-dasharray="5 4"/>
<circle cx="492" cy="185" r="7" fill="#07E9B4"/>
<text x="512" y="222" class="l" style="fill:#07E9B4;font-weight:700;font-size:14px">12mA → 50% → 5 bar</text>

<g class="l" text-anchor="end">
<text x="110" y="304">0 bar (0%)</text>
<text x="110" y="189">5 bar (50%)</text>
<text x="110" y="74">10 bar (100%)</text>
</g>
<g class="l" text-anchor="middle">
<text x="120" y="322">0</text><text x="244" y="322" style="fill:#cad2e2;font-weight:700">4</text><text x="368" y="322">8</text><text x="492" y="322" style="fill:#07E9B4;font-weight:700">12</text><text x="616" y="322">16</text><text x="740" y="322" style="fill:#cad2e2;font-weight:700">20</text>
<text x="435" y="350">Loop current (mA)</text>
</g>
</svg>
