<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t2 d2" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t2">How a PLC connects field devices through IO cards</title>
<desc id="d2">Field inputs go through an input card to the CPU. The CPU runs the program, then sends results through an output card to field outputs. Below, the three-step scan cycle: read inputs, run program, write outputs.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#07E9B4"/></marker>
</defs>
<style>
text{font-family:'Segoe UI',Arial,sans-serif}
.t{fill:#cad2e2;font-size:15px;font-weight:700}
.s{fill:#a4b1cd;font-size:12.5px}
.c{fill:#cad2e2;font-size:13.5px}
.k{font-size:11px;font-weight:700}
</style>
<rect width="900" height="400" rx="16" fill="#141d2b"/>

<rect x="20" y="30" width="190" height="200" rx="12" fill="#1a2331" stroke="#4a5466"/>
<text x="115" y="54" class="s" text-anchor="middle" letter-spacing="1.5">FIELD INPUTS</text>
<g>
<rect x="34" y="72" width="162" height="44" rx="8" fill="#141d2b" stroke="#4a5466"/><text x="46" y="99" class="c">Push button</text><text x="184" y="99" class="k" fill="#07E9B4" text-anchor="end">DI</text>
<rect x="34" y="124" width="162" height="44" rx="8" fill="#141d2b" stroke="#4a5466"/><text x="46" y="151" class="c">Proximity sensor</text><text x="184" y="151" class="k" fill="#07E9B4" text-anchor="end">DI</text>
<rect x="34" y="176" width="162" height="44" rx="8" fill="#141d2b" stroke="#4a5466"/><text x="46" y="203" class="c">4-20mA sensor</text><text x="184" y="203" class="k" fill="#f5b942" text-anchor="end">AI</text>
</g>

<rect x="245" y="30" width="110" height="200" rx="12" fill="#1a2331" stroke="#4a5466"/>
<text x="300" y="115" class="t" text-anchor="middle">Input</text><text x="300" y="135" class="t" text-anchor="middle">card</text>
<text x="300" y="165" class="s" text-anchor="middle">field signals</text><text x="300" y="182" class="s" text-anchor="middle">become data</text>

<rect x="390" y="30" width="120" height="200" rx="12" fill="#1a2331" stroke="#07E9B4" stroke-width="2.5"/>
<text x="450" y="115" class="t" text-anchor="middle" fill="#07E9B4">CPU</text>
<text x="450" y="145" class="s" text-anchor="middle">runs your</text><text x="450" y="162" class="s" text-anchor="middle">program</text>

<rect x="545" y="30" width="110" height="200" rx="12" fill="#1a2331" stroke="#4a5466"/>
<text x="600" y="115" class="t" text-anchor="middle">Output</text><text x="600" y="135" class="t" text-anchor="middle">card</text>
<text x="600" y="165" class="s" text-anchor="middle">results become</text><text x="600" y="182" class="s" text-anchor="middle">field signals</text>

<rect x="690" y="30" width="190" height="200" rx="12" fill="#1a2331" stroke="#4a5466"/>
<text x="785" y="54" class="s" text-anchor="middle" letter-spacing="1.5">FIELD OUTPUTS</text>
<g>
<rect x="704" y="72" width="162" height="44" rx="8" fill="#141d2b" stroke="#4a5466"/><text x="716" y="99" class="c">Contactor coil</text><text x="854" y="99" class="k" fill="#07E9B4" text-anchor="end">DO</text>
<rect x="704" y="124" width="162" height="44" rx="8" fill="#141d2b" stroke="#4a5466"/><text x="716" y="151" class="c">Solenoid valve</text><text x="854" y="151" class="k" fill="#07E9B4" text-anchor="end">DO</text>
<rect x="704" y="176" width="162" height="44" rx="8" fill="#141d2b" stroke="#4a5466"/><text x="716" y="203" class="c">Drive speed ref</text><text x="854" y="203" class="k" fill="#f5b942" text-anchor="end">AO</text>
</g>

<path d="M210 130H243" stroke="#07E9B4" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M355 130H388" stroke="#07E9B4" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M510 130H543" stroke="#07E9B4" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M655 130H688" stroke="#07E9B4" stroke-width="2.5" marker-end="url(#a)"/>

<text x="20" y="278" class="s" letter-spacing="1.5">THE SCAN CYCLE</text>
<rect x="110" y="292" width="200" height="52" rx="26" fill="#1a2331" stroke="#4a5466"/><text x="210" y="324" class="c" text-anchor="middle">1 · Read inputs</text>
<rect x="350" y="292" width="200" height="52" rx="26" fill="#1a2331" stroke="#07E9B4" stroke-width="2"/><text x="450" y="324" class="c" text-anchor="middle">2 · Run program</text>
<rect x="590" y="292" width="200" height="52" rx="26" fill="#1a2331" stroke="#4a5466"/><text x="690" y="324" class="c" text-anchor="middle">3 · Write outputs</text>
<path d="M310 318H346" stroke="#07E9B4" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M550 318H586" stroke="#07E9B4" stroke-width="2.5" marker-end="url(#a)"/>
<text x="450" y="374" class="s" text-anchor="middle">...then it starts again, many times every second</text>
</svg>
