<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="Program structure" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Program structure</title>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#07E9B4"/></marker></defs>
<rect width="900" height="400" rx="16" fill="#141d2b"/>
<text x="450" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#cad2e2" text-anchor="middle" font-weight="bold">Step 4  •  Program structure</text><rect x="40" y="70" width="820" height="300" rx="12" fill="#1a2331" stroke="#07E9B4" stroke-width="1.5"/><text x="450" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#07E9B4" text-anchor="middle" font-weight="bold">LAD 2 (single program file)  •  8 rungs</text><rect x="60" y="125" width="185" height="150" rx="10" fill="#141d2b" stroke="#4a5466" stroke-width="1.5"/><text x="152" y="155" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#f5b942" text-anchor="middle" font-weight="bold">Rungs 0000–0001</text><text x="152" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#cad2e2" text-anchor="middle" font-weight="bold">Basic gates</text><text x="152" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#07E9B4" text-anchor="middle" font-weight="normal">AND, OR</text><rect x="260" y="125" width="185" height="150" rx="10" fill="#141d2b" stroke="#4a5466" stroke-width="1.5"/><text x="352" y="155" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#f5b942" text-anchor="middle" font-weight="bold">Rung 0002</text><text x="352" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#cad2e2" text-anchor="middle" font-weight="bold">Inverter</text><text x="352" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#07E9B4" text-anchor="middle" font-weight="normal">NOT</text><rect x="460" y="125" width="185" height="150" rx="10" fill="#141d2b" stroke="#4a5466" stroke-width="1.5"/><text x="552" y="155" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#f5b942" text-anchor="middle" font-weight="bold">Rungs 0003–0004</text><text x="552" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#cad2e2" text-anchor="middle" font-weight="bold">Inverted gates</text><text x="552" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#07E9B4" text-anchor="middle" font-weight="normal">NAND, NOR</text><rect x="660" y="125" width="185" height="150" rx="10" fill="#141d2b" stroke="#4a5466" stroke-width="1.5"/><text x="752" y="155" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#f5b942" text-anchor="middle" font-weight="bold">Rungs 0005–0006</text><text x="752" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#cad2e2" text-anchor="middle" font-weight="bold">Exclusive gates</text><text x="752" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#07E9B4" text-anchor="middle" font-weight="normal">XOR, XNOR</text><rect x="60" y="290" width="780" height="50" rx="10" fill="#141d2b" stroke="#4a5466" stroke-width="1.5"/><text x="450" y="321" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#a4b1cd" text-anchor="middle" font-weight="normal">Rung 0007  •  END</text><text x="450" y="358" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#a4b1cd" text-anchor="middle" font-weight="normal">Bits used: 13 input bits and 7 output bits within B3:0/0 – B3:1/4 (B3:0/2 is unused)</text>
</svg>