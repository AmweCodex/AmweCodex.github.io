</style><rect width="900" height="430" rx="16" fill="#141d2b"/><path d="M260 30V385" stroke="#4a5466" stroke-width="1.5" stroke-dasharray="5 5"/><path d="M340 30V385" stroke="#4a5466" stroke-width="1.5" stroke-dasharray="5 5"/><path d="M540 30V385" stroke="#4a5466" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="340" y="320" width="200" height="60" rx="6" fill="#07E9B4" opacity=".08"/><text x="24" y="76" class="b" text-anchor="start" >Start rung</text><text x="24" y="96" class="s" text-anchor="start" >TRUE for a moment</text><path d="M200 96H860" stroke="#4a5466" stroke-width="1" opacity=".6"/><path d="M200 96H260V60H340V96H860" fill="none" stroke="#a4b1cd" stroke-width="3.5" stroke-linejoin="round"/><text x="24" y="166" class="b" text-anchor="start" >Reset rung</text><text x="24" y="186" class="s" text-anchor="start" >the OTU rung</text><path d="M200 186H860" stroke="#4a5466" stroke-width="1" opacity=".6"/><path d="M200 186H540V150H620V186H860" fill="none" stroke="#a4b1cd" stroke-width="3.5" stroke-linejoin="round"/><text x="24" y="256" class="b" text-anchor="start" >OTE bit</text><text x="24" y="276" class="s" text-anchor="start" >no memory</text><path d="M200 276H860" stroke="#4a5466" stroke-width="1" opacity=".6"/><path d="M200 276H260V240H340V276H860" fill="none" stroke="#f5b942" stroke-width="3.5" stroke-linejoin="round"/><text x="24" y="346" class="b" text-anchor="start" >OTL bit</text><text x="24" y="366" class="s" text-anchor="start" >retentive</text><path d="M200 366H860" stroke="#4a5466" stroke-width="1" opacity=".6"/><path d="M200 366H260V330H540V366H860" fill="none" stroke="#07E9B4" stroke-width="3.5" stroke-linejoin="round"/><text x="360" y="260" class="s" text-anchor="start" >drops when rung is FALSE</text><text x="440" y="353" class="s" text-anchor="middle" style="fill:#07E9B4">still ON (retentive)</text><text x="260" y="402" class="s" text-anchor="middle" >1 · rung goes TRUE</text><text x="540" y="402" class="s" text-anchor="middle" >3 · OTU rung TRUE</text><text x="340" y="420" class="s" text-anchor="middle" >2 · rung goes FALSE</text></svg>