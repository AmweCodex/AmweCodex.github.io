 text-anchor="middle" fill="#f5b942">OTE</text><text x="260" y="298" class="mn" text-anchor="middle" fill="#f5b942">SEAL-IN BRANCH</text><rect x="50" y="330" width="250" height="76" rx="10" fill="#1a2331" stroke="#4a5466"/><text x="66" y="362" class="b" text-anchor="start" >1 · Press Start_PB</text><text x="66" y="386" class="s" text-anchor="start" >Power flows, Motor_Run is ON</text><rect x="325" y="330" width="250" height="76" rx="10" fill="#1a2331" stroke="#4a5466"/><text x="341" y="362" class="b" text-anchor="start" >2 · Contact closes</text><text x="341" y="386" class="s" text-anchor="start" >It now feeds the rung itself</text><rect x="600" y="330" width="250" height="76" rx="10" fill="#1a2331" stroke="#4a5466"/><text x="616" y="362" class="b" text-anchor="start" >3 · Release Start_PB</text><text x="616" y="386" class="s" text-anchor="start" >Still ON. Only Stop_PB stops it</text></svg>