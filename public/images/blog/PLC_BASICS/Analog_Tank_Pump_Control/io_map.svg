<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t2 d2" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t2">I/O map for the analog tank program</title><desc id="d2">One analog level sensor scaled by an SCP instruction into a 0 to 100 percent value, plus pump and valve outputs on the output module.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#07E9B4"/></marker></defs><style>
text{font-family:'Segoe UI',Arial,sans-serif}
.h{font-size:18px;font-weight:700;fill:#cad2e2}
.b{font-size:15px;font-weight:700;fill:#cad2e2}
.s{font-size:13px;fill:#a4b1cd}
.mn{font-size:11.5px;font-weight:700;letter-spacing:1.2px}
</style>
<rect width="900" height="380" rx="16" fill="#141d2b"/>
<text x="20" y="38" class="h" text-anchor="start" style="font-size:12.5px;letter-spacing:1.5px;font-weight:400;fill:#a4b1cd">INPUT · analog level sensor</text>
<text x="880" y="38" class="h" text-anchor="end" style="font-size:12.5px;letter-spacing:1.5px;font-weight:400;fill:#a4b1cd">OUTPUTS · 1762-OW8</text>

<rect x="20" y="140" width="300" height="100" rx="10" fill="#1a2331" stroke="#4a5466" stroke-width="1.5"/>
<text x="34" y="174" class="b">Level sensor</text>
<text x="34" y="196" class="s">I:3.0 · raw 0–16383</text>
<text x="34" y="216" class="s">4–20 mA / 0–10 V transmitter</text>
<rect x="262" y="156" width="40" height="24" rx="12" fill="#07E9B4" opacity=".18"/>
<text x="282" y="173" class="mn" text-anchor="middle" fill="#07E9B4">AI</text>
<path d="M320 186L378 190" stroke="#07E9B4" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

<rect x="380" y="140" width="150" height="100" rx="14" fill="#1a2331" stroke="#07E9B4" stroke-width="2.5"/>
<text x="455" y="180" class="b" text-anchor="middle" style="fill:#07E9B4">SCP</text>
<text x="455" y="200" class="s" text-anchor="middle">0–16383 →</text>
<text x="455" y="218" class="s" text-anchor="middle">N7:0 = 0–100%</text>

<rect x="590" y="90" width="290" height="72" rx="10" fill="#1a2331" stroke="#4a5466" stroke-width="1.5"/>
<text x="604" y="124" class="b">Pump</text>
<text x="604" y="143" class="s">O:2/0 · pump motor</text>
<rect x="832" y="106" width="36" height="24" rx="12" fill="#07E9B4" opacity=".18"/>
<text x="850" y="123" class="mn" text-anchor="middle" fill="#07E9B4">DO</text>
<path d="M530 178L588 128" stroke="#07E9B4" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

<rect x="590" y="220" width="290" height="72" rx="10" fill="#1a2331" stroke="#4a5466" stroke-width="1.5"/>
<text x="604" y="254" class="b">Valve</text>
<text x="604" y="273" class="s">O:2/1 · drain valve</text>
<rect x="832" y="236" width="36" height="24" rx="12" fill="#07E9B4" opacity=".18"/>
<text x="850" y="253" class="mn" text-anchor="middle" fill="#07E9B4">DO</text>
<path d="M530 202L588 252" stroke="#07E9B4" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

<text x="450" y="340" class="s" text-anchor="middle">SCP runs every scan; CONTROLS then compares N7:0 (LEVEL) against 20% and 80%.</text>
</svg>
