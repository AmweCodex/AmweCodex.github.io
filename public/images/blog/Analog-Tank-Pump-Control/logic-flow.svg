<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t4 d4" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t4">Logic flow</title><desc id="d4">LEVEL is compared less than 20 percent through a 10 second timer to set FILL_MODE, which seals itself in. LEVEL greater than 80 percent through a 10 second timer breaks the seal. FILL_MODE drives the pump directly and the valve through an inverted contact.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#07E9B4"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f5b942"/></marker><marker id="c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a4b1cd"/></marker></defs><style>
text{font-family:'Segoe UI',Arial,sans-serif}
.h{font-size:14.5px;font-weight:700;fill:#cad2e2}
.s{font-size:12.5px;fill:#a4b1cd}
</style>
<rect width="900" height="420" rx="16" fill="#141d2b"/>
<text x="450" y="32" class="h" text-anchor="middle" style="font-size:18px">Logic flow — LEVEL drives the same seal-in circuit</text>

<rect x="20" y="60" width="160" height="46" rx="8" fill="#1a2331" stroke="#4a5466"/>
<text x="100" y="82" class="h" text-anchor="middle">LES N7:0 &lt; 20</text>
<text x="100" y="98" class="s" text-anchor="middle">LEVEL low</text>
<rect x="210" y="60" width="150" height="46" rx="8" fill="#1a2331" stroke="#4a5466"/>
<text x="285" y="82" class="h" text-anchor="middle">TON T4:0</text>
<text x="285" y="98" class="s" text-anchor="middle">10s preset</text>
<rect x="390" y="60" width="180" height="46" rx="8" fill="#1a2331" stroke="#07E9B4" stroke-width="2.5"/>
<text x="480" y="88" class="h" text-anchor="middle" style="fill:#07E9B4">SET · OTE FILL_MODE</text>

<rect x="20" y="200" width="160" height="46" rx="8" fill="#1a2331" stroke="#4a5466"/>
<text x="100" y="222" class="h" text-anchor="middle">GRT N7:0 &gt; 80</text>
<text x="100" y="238" class="s" text-anchor="middle">LEVEL high</text>
<rect x="210" y="200" width="150" height="46" rx="8" fill="#1a2331" stroke="#4a5466"/>
<text x="285" y="222" class="h" text-anchor="middle">TON T4:1</text>
<text x="285" y="238" class="s" text-anchor="middle">10s preset</text>
<rect x="390" y="200" width="180" height="46" rx="8" fill="#1a2331" stroke="#f5b942" stroke-width="2.5"/>
<text x="480" y="220" class="h" text-anchor="middle" style="fill:#f5b942">BREAK · XIO T4:1/DN</text>
<text x="480" y="236" class="s" text-anchor="middle">opens the seal contact</text>

<rect x="650" y="130" width="90" height="46" rx="8" fill="#1a2331" stroke="#a4b1cd"/>
<text x="695" y="158" class="h" text-anchor="middle">PUMP</text>
<text x="695" y="195" class="s" text-anchor="middle">XIC FILL_MODE</text>

<rect x="780" y="130" width="90" height="46" rx="8" fill="#1a2331" stroke="#a4b1cd" stroke-dasharray="4 3"/>
<text x="825" y="158" class="h" text-anchor="middle">VALVE</text>
<text x="825" y="195" class="s" text-anchor="middle">XIO FILL_MODE</text>

<path d="M180 83L210 83" stroke="#4a5466" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M360 83L390 83" stroke="#4a5466" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M180 223L210 223" stroke="#4a5466" stroke-width="2" fill="none" marker-end="url(#b)"/>
<path d="M360 223L390 223" stroke="#4a5466" stroke-width="2" fill="none" marker-end="url(#b)"/>

<path d="M480 106L480 155" stroke="#07E9B4" stroke-width="2" fill="none" marker-end="url(#c)"/>
<text x="500" y="132" class="s">seals</text>
<path d="M480 246L480 206" stroke="#f5b942" stroke-width="2" fill="none" stroke-dasharray="4 3"/>
<text x="505" y="235" class="s">breaks</text>

<path d="M570 88L650 148" stroke="#a4b1cd" stroke-width="2.5" fill="none" marker-end="url(#c)"/>
<path d="M570 88L780 148" stroke="#a4b1cd" stroke-width="2.5" fill="none" stroke-dasharray="5 4" marker-end="url(#c)"/>

<text x="450" y="300" class="s" text-anchor="middle">FILL_MODE feeds back into its own rung (top arrow) — that's the seal-in.</text>
<text x="450" y="322" class="s" text-anchor="middle">Pump follows FILL_MODE directly; valve runs on the opposite (XIO) — they never run together.</text>
</svg>
