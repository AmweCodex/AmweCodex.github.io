<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t5 d5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t5">Expected behaviour over one fill/drain cycle</title><desc id="d5">LEVEL falls below 20 percent and stays there for 10 seconds, setting FILL_MODE and starting the pump. LEVEL then rises; once it passes 80 percent and stays there for 10 seconds, the seal breaks, the pump stops and the valve opens.</desc><style>
text{font-family:'Segoe UI',Arial,sans-serif}
.b{font-size:15px;font-weight:700;fill:#cad2e2}
.s{font-size:13px;fill:#a4b1cd}
</style>
<rect width="900" height="560" rx="16" fill="#141d2b"/>

<text x="24" y="50" class="b" text-anchor="start">LEVEL %</text>
<text x="24" y="70" class="s" text-anchor="start">N7:0</text>
<rect x="200" y="24" width="660" height="120" rx="6" fill="none" stroke="#4a5466"/>
<path d="M200 60H860" stroke="#4a5466" stroke-dasharray="4 4"/>
<text x="864" y="64" class="s">80%</text>
<path d="M200 108H860" stroke="#4a5466" stroke-dasharray="4 4"/>
<text x="864" y="112" class="s">20%</text>
<path d="M200 130 C300 140,330 108,350 108 C450 108,420 44,480 44 C560 44,600 60,620 60 C700 60,720 130,860 130" fill="none" stroke="#07E9B4" stroke-width="3"/>

<path d="M250 24V468" stroke="#4a5466" stroke-width="1.5" stroke-dasharray="5 5"/>
<path d="M350 24V468" stroke="#4a5466" stroke-width="1.5" stroke-dasharray="5 5"/>
<path d="M620 24V468" stroke="#4a5466" stroke-width="1.5" stroke-dasharray="5 5"/>
<path d="M720 24V468" stroke="#4a5466" stroke-width="1.5" stroke-dasharray="5 5"/>

<text x="24" y="190" class="b" text-anchor="start">T4:0 DN</text>
<text x="24" y="210" class="s" text-anchor="start">fill timer done</text>
<path d="M200 206H860" stroke="#4a5466" stroke-width="1" opacity=".6"/>

<text x="24" y="266" class="b" text-anchor="start">FILL_MODE</text>
<text x="24" y="286" class="s" text-anchor="start">B3:0/6, seal-in</text>
<path d="M200 282H860" stroke="#4a5466" stroke-width="1" opacity=".6"/>

<text x="24" y="342" class="b" text-anchor="start">PUMP</text>
<text x="24" y="362" class="s" text-anchor="start">O:2/0</text>
<path d="M200 358H860" stroke="#4a5466" stroke-width="1" opacity=".6"/>

<text x="24" y="418" class="b" text-anchor="start">VALVE</text>
<text x="24" y="438" class="s" text-anchor="start">O:2/1</text>
<path d="M200 434H860" stroke="#4a5466" stroke-width="1" opacity=".6"/>

<text x="24" y="494" class="b" text-anchor="start">T4:1 DN</text>
<text x="24" y="514" class="s" text-anchor="start">drain timer done</text>
<path d="M200 510H860" stroke="#4a5466" stroke-width="1" opacity=".6"/>

<path d="M200 206H350V170H620V206H860" fill="none" stroke="#f5b942" stroke-width="3.5" stroke-linejoin="round"/>
<path d="M200 282H350V246H720V282H860" fill="none" stroke="#07E9B4" stroke-width="3.5" stroke-linejoin="round"/>
<path d="M200 358H350V322H720V358H860" fill="none" stroke="#07E9B4" stroke-width="3.5" stroke-linejoin="round"/>
<path d="M200 398H350V434H720V398H860" fill="none" stroke="#a4b1cd" stroke-width="3.5" stroke-linejoin="round"/>
<path d="M200 510H620V474H720V510H860" fill="none" stroke="#f5b942" stroke-width="3.5" stroke-linejoin="round"/>

<text x="250" y="540" class="s" text-anchor="middle">LEVEL under 20% for 10s</text>
<text x="670" y="540" class="s" text-anchor="middle">LEVEL over 80% for 10s</text>
</svg>
