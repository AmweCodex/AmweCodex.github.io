<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="t4 d4" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t4">How the blower logic flows</title><desc id="d4">Each push button goes through a one-shot and writes 0, 1 or 2 into N7:0. Two comparisons then decide if the blower coil B3:0/3 turns on.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#07E9B4"/></marker></defs><style>
text{font-family:'Segoe UI',Arial,sans-serif}
.h{font-size:18px;font-weight:700;fill:#cad2e2}
.b{font-size:15px;font-weight:700;fill:#cad2e2}
.s{font-size:13px;fill:#a4b1cd}
.m{font-size:14px;fill:#cad2e2}
.mn{font-size:11.5px;font-weight:700;letter-spacing:1.2px}
.mono{font-family:'Consolas','Courier New',monospace;font-size:15px;font-weight:700;fill:#cad2e2}
</style><rect width="900" height="440" rx="16" fill="#141d2b"/><text x="20" y="36" class="s" text-anchor="start" style="letter-spacing:1.5px">1 · BUTTON</text><text x="195" y="36" class="s" text-anchor="start" style="letter-spacing:1.5px">2 · ONCE</text><text x="300" y="36" class="s" text-anchor="start" style="letter-spacing:1.5px">3 · WRITE</text><text x="440" y="36" class="s" text-anchor="start" style="letter-spacing:1.5px">4 · REMEMBER</text><text x="590" y="36" class="s" text-anchor="start" style="letter-spacing:1.5px">5 · DECIDE</text><text x="780" y="36" class="s" text-anchor="start" style="letter-spacing:1.5px">6 · RUN</text><rect x="20" y="80" width="150" height="60" rx="10" fill="#1a2331" stroke="#07E9B4" stroke-width="1.5"/><text x="34" y="108.0" class="b" text-anchor="start" >HAND_PB</text><text x="34" y="127.0" class="s" text-anchor="start" >XIC B3:0/0</text><rect x="195" y="80" width="80" height="60" rx="10" fill="#1a2331" stroke="#f5b942" stroke-width="1.5"/><text x="209" y="108.0" class="b" text-anchor="start" >ONS</text><text x="209" y="127.0" class="s" text-anchor="start" >B3:0/4</text><rect x="300" y="80" width="110" height="60" rx="10" fill="#1a2331" stroke="#f5b942" stroke-width="1.5"/><text x="314" y="108.0" class="b" text-anchor="start" >MOV 1</text><text x="314" y="127.0" class="s" text-anchor="start" >to N7:0</text><path d="M170 110L193 110" stroke="#07E9B4" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M275 110L298 110" stroke="#07E9B4" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M410 110L438 110" stroke="#07E9B4" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="20" y="180" width="150" height="60" rx="10" fill="#1a2331" stroke="#07E9B4" stroke-width="1.5"/><text x="34" y="208.0" class="b" text-anchor="start" >OFF_PB</text><text x="34" y="227.0" class="s" text-anchor="start" >XIC B3:0/1</text><rect x="195" y="180" width="80" height="60" rx="10" fill="#1a2331" stroke="#f5b942" stroke-width="1.5"/><text x="209" y="208.0" class="b" text-anchor="start" >ONS</text><text x="209" y="227.0" class="s" text-anchor="start" >B3:0/5</text><rect x="300" y="180" width="110" height="60" rx="10" fill="#1a2331" stroke="#f5b942" stroke-width="1.5"/><text x="314" y="208.0" class="b" text-anchor="start" >MOV 0</text><text x="314" y="227.0" class="s" text-anchor="start" >to N7:0</text><path d="M170 210L193 210" stroke="#07E9B4" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M275 210L298 210" stroke="#07E9B4" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M410 210L438 210" stroke="#07E9B4" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="20" y="280" width="150" height="60" rx="10" fill="#1a2331" stroke="#07E9B4" stroke-width="1.5"/><text x="34" y="308.0" class="b" text-anchor="start" >AUTO_PB</text><text x="34" y="327.0" class="s" text-anchor="start" >XIC B3:0/2</text><rect x="195" y="280" width="80" height="60" rx="10" fill="#1a2331" stroke="#f5b942" stroke-width="1.5"/><text x="209" y="308.0" class="b" text-anchor="start" >ONS</text><text x="209" y="327.0" class="s" text-anchor="start" >B3:0/6</text><rect x="300" y="280" width="110" height="60" rx="10" fill="#1a2331" stroke="#f5b942" stroke-width="1.5"/><text x="314" y="308.0" class="b" text-anchor="start" >MOV 2</text><text x="314" y="327.0" class="s" text-anchor="start" >to N7:0</text><path d="M170 310L193 310" stroke="#07E9B4" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M275 310L298 310" stroke="#07E9B4" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M410 310L438 310" stroke="#07E9B4" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="440" y="70" width="130" height="270" rx="14" fill="#1a2331" stroke="#07E9B4" stroke-width="2.5"/><text x="505" y="110" class="h" text-anchor="middle" style="fill:#07E9B4">N7:0</text><text x="505" y="132" class="s" text-anchor="middle" >BLOWER_STATE</text><text x="505" y="190" class="b" text-anchor="middle" >0 = OFF</text><text x="505" y="230" class="b" text-anchor="middle" >1 = HAND</text><text x="505" y="270" class="b" text-anchor="middle" >2 = AUTO</text><rect x="590" y="110" width="150" height="60" rx="10" fill="#1a2331" stroke="#07E9B4" stroke-width="1.5"/><text x="604" y="138.0" class="b" text-anchor="start" >EQU N7:0 = 1</text><text x="604" y="157.0" class="s" text-anchor="start" >HAND mode</text><rect x="590" y="230" width="150" height="76" rx="10" fill="#1a2331" stroke="#07E9B4" stroke-width="1.5"/><text x="604" y="266.0" class="b" text-anchor="start" >EQU N7:0 = 2</text><text x="604" y="285.0" class="s" text-anchor="start" >then XIC B3:0/7</text><path d="M570 140L588 140" stroke="#07E9B4" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M570 268L588 268" stroke="#07E9B4" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M740 140H762V205M740 268H762V205" stroke="#a4b1cd" stroke-width="2.5" fill="none"/><path d="M762 205L778 205" stroke="#07E9B4" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="750" y="209" class="mn" text-anchor="middle" fill="#f5b942">OR</text><rect x="780" y="170" width="100" height="70" rx="10" fill="#1a2331" stroke="#f5b942" stroke-width="2"/><text x="830" y="198" class="b" text-anchor="middle" style="fill:#f5b942">OTE</text><text x="830" y="218" class="s" text-anchor="middle" >BLOWER</text><text x="830" y="234" class="s" text-anchor="middle" >B3:0/3</text><text x="450" y="400" class="s" text-anchor="middle" >The blower coil B3:0/3 then drives the output O:2/0 in the DIGITAL IO file.</text></svg>