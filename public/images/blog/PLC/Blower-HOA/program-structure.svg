<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t3 d3" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t3">Program structure</title><desc id="d3">The MAIN file jumps to the DIGITAL IO subroutine first, then the CONTROLS subroutine, and then ends.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#07E9B4"/></marker></defs><style>
text{font-family:'Segoe UI',Arial,sans-serif}
.h{font-size:18px;font-weight:700;fill:#cad2e2}
.b{font-size:15px;font-weight:700;fill:#cad2e2}
.s{font-size:13px;fill:#a4b1cd}
.m{font-size:14px;fill:#cad2e2}
.mn{font-size:11.5px;font-weight:700;letter-spacing:1.2px}
.mono{font-family:'Consolas','Courier New',monospace;font-size:15px;font-weight:700;fill:#cad2e2}
</style><rect width="900" height="420" rx="16" fill="#141d2b"/><rect x="300" y="30" width="300" height="110" rx="12" fill="#1a2331" stroke="#07E9B4" stroke-width="2.5"/><text x="450" y="62" class="h" text-anchor="middle" style="fill:#07E9B4">LAD 2 · MAIN</text><text x="450" y="88" class="s" text-anchor="middle" >Rung 0: JSR to U:3</text><text x="450" y="108" class="s" text-anchor="middle" >Rung 1: JSR to U:4</text><text x="450" y="128" class="s" text-anchor="middle" >Rung 2: END</text><rect x="40" y="250" width="380" height="130" rx="12" fill="#1a2331" stroke="#4a5466"/><text x="62" y="286" class="h" text-anchor="start" >LAD 3 · DIGITAL IO</text><text x="62" y="318" class="s" text-anchor="start" >Copies the push buttons into internal bits</text><text x="62" y="340" class="s" text-anchor="start" >Drives the blower output</text><rect x="480" y="250" width="380" height="130" rx="12" fill="#1a2331" stroke="#4a5466"/><text x="502" y="286" class="h" text-anchor="start" >LAD 4 · CONTROLS</text><text x="502" y="318" class="s" text-anchor="start" >Picks the mode (0, 1 or 2)</text><text x="502" y="340" class="s" text-anchor="start" >Decides if the blower runs</text><path d="M390 140L250 248" stroke="#07E9B4" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M510 140L650 248" stroke="#07E9B4" stroke-width="2.5" fill="none" marker-end="url(#a)"/><circle cx="300" cy="190" r="15" fill="#141d2b" stroke="#f5b942" stroke-width="2"/><text x="300" y="195" class="b" text-anchor="middle" style="fill:#f5b942">1</text><circle cx="600" cy="190" r="15" fill="#141d2b" stroke="#f5b942" stroke-width="2"/><text x="600" y="195" class="b" text-anchor="middle" style="fill:#f5b942">2</text><text x="450" y="406" class="s" text-anchor="middle" >Every scan runs in this order: 1, then 2</text></svg>