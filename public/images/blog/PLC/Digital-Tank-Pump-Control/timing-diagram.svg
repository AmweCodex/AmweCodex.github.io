<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="t5 d5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t5">Expected behaviour over time</title><desc id="d5">The L switch held for 10 seconds latches FILL_MODE on and turns on the pump and valve. The H switch held for 10 seconds unlatches FILL_MODE off and turns them off again.</desc><style>
text{font-family:'Segoe UI',Arial,sans-serif}
.b{font-size:15px;font-weight:700;fill:#cad2e2}
.s{font-size:13px;fill:#a4b1cd}
</style>
<rect width="900" height="480" rx="16" fill="#141d2b"/>
<path d="M250 24V408" stroke="#4a5466" stroke-width="1.5" stroke-dasharray="5 5"/>
<path d="M350 24V408" stroke="#4a5466" stroke-width="1.5" stroke-dasharray="5 5"/>
<path d="M620 24V408" stroke="#4a5466" stroke-width="1.5" stroke-dasharray="5 5"/>
<path d="M720 24V408" stroke="#4a5466" stroke-width="1.5" stroke-dasharray="5 5"/>

<text x="24" y="70" class="b" text-anchor="start">L_SWITCH</text>
<text x="24" y="90" class="s" text-anchor="start">B3:0/0</text>
<path d="M200 86H860" stroke="#4a5466" stroke-width="1" opacity=".6"/>

<text x="24" y="150" class="b" text-anchor="start">T4:0 DN</text>
<text x="24" y="170" class="s" text-anchor="start">fill timer done</text>
<path d="M200 166H860" stroke="#4a5466" stroke-width="1" opacity=".6"/>

<text x="24" y="230" class="b" text-anchor="start">FILL_MODE</text>
<text x="24" y="250" class="s" text-anchor="start">B3:0/6</text>
<path d="M200 246H860" stroke="#4a5466" stroke-width="1" opacity=".6"/>

<text x="24" y="310" class="b" text-anchor="start">PUMP / VALVE</text>
<text x="24" y="330" class="s" text-anchor="start">O:2/0, O:2/1</text>
<path d="M200 326H860" stroke="#4a5466" stroke-width="1" opacity=".6"/>

<text x="24" y="390" class="b" text-anchor="start">H_SWITCH</text>
<text x="24" y="410" class="s" text-anchor="start">B3:0/2</text>
<path d="M200 406H860" stroke="#4a5466" stroke-width="1" opacity=".6"/>

<path d="M200 86H250V50H620V86H860" fill="none" stroke="#a4b1cd" stroke-width="3.5" stroke-linejoin="round"/>
<path d="M200 166H350V130H860" fill="none" stroke="#f5b942" stroke-width="3.5" stroke-linejoin="round"/>
<path d="M200 246H350V210H860" fill="none" stroke="#07E9B4" stroke-width="3.5" stroke-linejoin="round"/>
<path d="M200 326H350V290H860" fill="none" stroke="#07E9B4" stroke-width="3.5" stroke-linejoin="round"/>
<path d="M200 406H620V370H720V406H860" fill="none" stroke="#a4b1cd" stroke-width="3.5" stroke-linejoin="round"/>

<text x="225" y="398" class="b" text-anchor="middle">0</text>
<text x="435" y="398" class="b" text-anchor="middle">1</text>
<text x="670" y="398" class="b" text-anchor="middle">0</text>

<text x="250" y="446" class="s" text-anchor="middle">L held ON</text>
<text x="350" y="466" class="s" text-anchor="middle">10s later → T4:0 done, FILL_MODE latches</text>
<text x="670" y="446" class="s" text-anchor="middle">H held ON</text>
<text x="720" y="428" class="s" text-anchor="middle">10s later → T4:1 done, FILL_MODE unlatches</text>
</svg>
