<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t4 d4" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t4">Logic flow</title><desc id="d4">The L switch runs through a 10 second timer to latch FILL_MODE on. The H switch runs through a 10 second timer to unlatch FILL_MODE off. FILL_MODE drives the pump and valve.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#07E9B4"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f5b942"/></marker></defs><style>
text{font-family:'Segoe UI',Arial,sans-serif}
.h{font-size:15px;font-weight:700;fill:#cad2e2}
.s{font-size:12.5px;fill:#a4b1cd}
</style>
<rect width="900" height="380" rx="16" fill="#141d2b"/>
<text x="450" y="34" class="h" text-anchor="middle" style="font-size:18px">Logic flow — two timers latch one bit</text>

<rect x="20" y="70" width="140" height="46" rx="8" fill="#1a2331" stroke="#4a5466"/>
<text x="90" y="98" class="h" text-anchor="middle">L_SWITCH</text>
<rect x="200" y="70" width="160" height="46" rx="8" fill="#1a2331" stroke="#4a5466"/>
<text x="280" y="92" class="h" text-anchor="middle">TON T4:0</text>
<text x="280" y="108" class="s" text-anchor="middle">10s preset</text>
<rect x="400" y="70" width="180" height="46" rx="8" fill="#1a2331" stroke="#07E9B4" stroke-width="2.5"/>
<text x="490" y="98" class="h" text-anchor="middle" style="fill:#07E9B4">OTL FILL_MODE</text>

<rect x="20" y="200" width="140" height="46" rx="8" fill="#1a2331" stroke="#4a5466"/>
<text x="90" y="228" class="h" text-anchor="middle">H_SWITCH</text>
<rect x="200" y="200" width="160" height="46" rx="8" fill="#1a2331" stroke="#4a5466"/>
<text x="280" y="222" class="h" text-anchor="middle">TON T4:1</text>
<text x="280" y="238" class="s" text-anchor="middle">10s preset</text>
<rect x="400" y="200" width="180" height="46" rx="8" fill="#1a2331" stroke="#f5b942" stroke-width="2.5"/>
<text x="490" y="228" class="h" text-anchor="middle" style="fill:#f5b942">OTU FILL_MODE</text>

<rect x="650" y="135" width="100" height="46" rx="8" fill="#1a2331" stroke="#4a5466"/>
<text x="700" y="163" class="h" text-anchor="middle">PUMP</text>
<rect x="770" y="135" width="100" height="46" rx="8" fill="#1a2331" stroke="#4a5466"/>
<text x="820" y="163" class="h" text-anchor="middle">VALVE</text>

<path d="M160 93L200 93" stroke="#4a5466" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M360 93L400 93" stroke="#4a5466" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M160 223L200 223" stroke="#4a5466" stroke-width="2" fill="none" marker-end="url(#b)"/>
<path d="M360 223L400 223" stroke="#4a5466" stroke-width="2" fill="none" marker-end="url(#b)"/>
<path d="M580 93L650 158" stroke="#07E9B4" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<path d="M580 223L650 158" stroke="#f5b942" stroke-width="2.5" fill="none" stroke-dasharray="5 4"/>
<path d="M750 158L770 158" stroke="#4a5466" stroke-width="2" fill="none" marker-end="url(#a)"/>

<text x="450" y="330" class="s" text-anchor="middle">Read left to right: switch → 10s delay → latch/unlatch FILL_MODE → drive pump and valve.</text>
</svg>
