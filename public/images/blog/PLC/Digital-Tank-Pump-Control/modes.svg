<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="t1 d1" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t1">Tank fill/drain modes</title><desc id="d1">DRAIN MODE keeps the pump and valve off. A 10 second delay debounces the level switches. FILL MODE turns the pump and valve on.</desc><style>
text{font-family:'Segoe UI',Arial,sans-serif}
.h{font-size:18px;font-weight:700;fill:#cad2e2}
.b{font-size:15px;font-weight:700;fill:#cad2e2}
.s{font-size:13px;fill:#a4b1cd}
.mono{font-family:'Consolas','Courier New',monospace;font-size:15px;font-weight:700;fill:#cad2e2}
</style>
<rect width="900" height="330" rx="16" fill="#141d2b"/>

<rect x="20" y="20" width="280" height="290" rx="14" fill="#1a2331" stroke="#4a5466"/>
<text x="160" y="60" class="h" text-anchor="middle" style="font-size:24px;fill:#a4b1cd">DRAIN MODE</text>
<text x="160" y="84" class="mono" text-anchor="middle" style="font-size:13px">FILL_MODE = 0</text>
<circle cx="160" cy="160" r="40" fill="none" stroke="#4a5466" stroke-width="3"/>
<path d="M160 130 L160 190" stroke="#4a5466" stroke-width="3"/>
<path d="M150 176 L160 190 L170 176" fill="none" stroke="#4a5466" stroke-width="3" stroke-linejoin="round"/>
<text x="160" y="236" class="b" text-anchor="middle">Pump &amp; Valve OFF</text>
<text x="160" y="258" class="s" text-anchor="middle">Waiting for L switch</text>
<rect x="60" y="272" width="200" height="26" rx="13" fill="#141d2b" stroke="#4a5466"/>
<text x="160" y="290" class="s" text-anchor="middle">Latched OFF by T4:1</text>

<rect x="320" y="20" width="280" height="290" rx="14" fill="#1a2331" stroke="#4a5466"/>
<text x="460" y="60" class="h" text-anchor="middle" style="font-size:24px;fill:#f5b942">10s DELAY</text>
<text x="460" y="84" class="mono" text-anchor="middle" style="font-size:13px">TON T4:0 / T4:1</text>
<circle cx="460" cy="160" r="40" fill="none" stroke="#f5b942" stroke-width="3" stroke-dasharray="6 5"/>
<path d="M460 160 L460 132" stroke="#f5b942" stroke-width="3"/>
<path d="M460 160 L482 168" stroke="#f5b942" stroke-width="3"/>
<circle cx="460" cy="160" r="4" fill="#f5b942"/>
<text x="460" y="236" class="b" text-anchor="middle">Switch must hold</text>
<text x="460" y="258" class="s" text-anchor="middle">for the full 10s preset</text>
<rect x="360" y="272" width="200" height="26" rx="13" fill="#141d2b" stroke="#4a5466"/>
<text x="460" y="290" class="s" text-anchor="middle">Debounces the level</text>

<rect x="620" y="20" width="280" height="290" rx="14" fill="#1a2331" stroke="#07E9B4" stroke-width="2.5"/>
<text x="760" y="60" class="h" text-anchor="middle" style="font-size:24px;fill:#07E9B4">FILL MODE</text>
<text x="760" y="84" class="mono" text-anchor="middle" style="font-size:13px">FILL_MODE = 1</text>
<circle cx="760" cy="160" r="40" fill="none" stroke="#07E9B4" stroke-width="3"/>
<path d="M760 190 L760 130" stroke="#07E9B4" stroke-width="3"/>
<path d="M750 144 L760 130 L770 144" fill="none" stroke="#07E9B4" stroke-width="3" stroke-linejoin="round"/>
<text x="760" y="236" class="b" text-anchor="middle">Pump &amp; Valve ON</text>
<text x="760" y="258" class="s" text-anchor="middle">Runs until H holds 10s</text>
<rect x="660" y="272" width="200" height="26" rx="13" fill="#141d2b" stroke="#4a5466"/>
<text x="760" y="290" class="s" text-anchor="middle">Latched ON by T4:0</text>
</svg>
