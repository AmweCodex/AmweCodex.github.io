<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 456" role="img" aria-labelledby="t5 d5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t5">RTO retentive timer timing</title><desc id="d5">The retentive timer adds up time over several input pulses. The elapsed time holds when the input drops. The output turns on when it reaches the preset, and only a reset clears it.</desc><defs></defs><style>
text{font-family:'Segoe UI',Arial,sans-serif}
.h{font-size:18px;font-weight:700;fill:#cad2e2}
.b{font-size:15px;font-weight:700;fill:#cad2e2}
.s{font-size:13px;fill:#a4b1cd}
.m{font-size:14px;fill:#cad2e2}
.mn{font-size:11.5px;font-weight:700;letter-spacing:1.2px}
.mono{font-family:'Consolas','Courier New',monospace;font-size:15px;font-weight:700;fill:#cad2e2}
</style><rect width="900" height="456" rx="16" fill="#141d2b"/><path d="M340 30V398" stroke="#4a5466" stroke-width="1.5" stroke-dasharray="5 5"/><path d="M640 30V398" stroke="#4a5466" stroke-width="1.5" stroke-dasharray="5 5"/><path d="M780 30V398" stroke="#4a5466" stroke-width="1.5" stroke-dasharray="5 5"/><text x="24" y="80.0" class="b" text-anchor="start" >Input</text><text x="24" y="100.0" class="s" text-anchor="start" >on and off</text><path d="M200 96H860" stroke="#4a5466" stroke-width="1" opacity=".6"/><text x="24" y="178.0" class="b" text-anchor="start" >ET / ACC</text><text x="24" y="198.0" class="s" text-anchor="start" >time adds up</text><path d="M200 206H860" stroke="#4a5466" stroke-width="1" opacity=".6"/><text x="24" y="280.0" class="b" text-anchor="start" >.DN / Q</text><text x="24" y="300.0" class="s" text-anchor="start" >done</text><path d="M200 296H860" stroke="#4a5466" stroke-width="1" opacity=".6"/><text x="24" y="370.0" class="b" text-anchor="start" >RES</text><text x="24" y="390.0" class="s" text-anchor="start" >reset</text><path d="M200 386H860" stroke="#4a5466" stroke-width="1" opacity=".6"/><path d="M200 96H240V60H340V96H420V60H520V96H600V60H700V96H860" fill="none" stroke="#a4b1cd" stroke-width="3.5" stroke-linejoin="round"/><path d="M200 206H240L340 181H420L520 156H600L640 146H780V206H860" fill="none" stroke="#07E9B4" stroke-width="3.5" stroke-linejoin="round"/><path d="M200 146H860" stroke="#f5b942" stroke-width="1.5" stroke-dasharray="6 5"/><text x="856" y="140" class="s" text-anchor="end" style="fill:#f5b942">PT</text><path d="M200 296H640V260H780V296H860" fill="none" stroke="#07E9B4" stroke-width="3.5" stroke-linejoin="round"/><path d="M200 386H780V350H810V386H860" fill="none" stroke="#a4b1cd" stroke-width="3.5" stroke-linejoin="round"/><text x="440" y="130" class="s" text-anchor="middle" style="fill:#f5b942">time adds up over several presses</text><text x="340" y="420" class="s" text-anchor="middle" >input off: ET holds</text><text x="640" y="420" class="s" text-anchor="middle" >ET = PT: Q on</text><text x="780" y="440" class="s" text-anchor="middle" >RES clears ET and Q</text></svg>