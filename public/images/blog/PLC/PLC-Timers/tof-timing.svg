<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="t3 d3" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t3">TOF timing with EN, ET, TT and DN</title><desc id="d3">While the input is true the output is on. When the input drops, the timer counts to the preset and then the output turns off. If the input returns in time the timer resets and the output never drops.</desc><defs></defs><style>
text{font-family:'Segoe UI',Arial,sans-serif}
.h{font-size:18px;font-weight:700;fill:#cad2e2}
.b{font-size:15px;font-weight:700;fill:#cad2e2}
.s{font-size:13px;fill:#a4b1cd}
.m{font-size:14px;fill:#cad2e2}
.mn{font-size:11.5px;font-weight:700;letter-spacing:1.2px}
.mono{font-family:'Consolas','Courier New',monospace;font-size:15px;font-weight:700;fill:#cad2e2}
</style><rect width="900" height="450" rx="16" fill="#141d2b"/><path d="M460 30V392" stroke="#4a5466" stroke-width="1.5" stroke-dasharray="5 5"/><path d="M500 30V392" stroke="#4a5466" stroke-width="1.5" stroke-dasharray="5 5"/><path d="M680 30V392" stroke="#4a5466" stroke-width="1.5" stroke-dasharray="5 5"/><text x="24" y="80.0" class="b" text-anchor="start" >Input (EN)</text><text x="24" y="100.0" class="s" text-anchor="start" >mirrors your rung</text><path d="M200 96H860" stroke="#4a5466" stroke-width="1" opacity=".6"/><text x="24" y="178.0" class="b" text-anchor="start" >ET / ACC</text><text x="24" y="198.0" class="s" text-anchor="start" >elapsed time</text><path d="M200 206H860" stroke="#4a5466" stroke-width="1" opacity=".6"/><text x="24" y="280.0" class="b" text-anchor="start" >.TT</text><text x="24" y="300.0" class="s" text-anchor="start" >timing</text><path d="M200 296H860" stroke="#4a5466" stroke-width="1" opacity=".6"/><text x="24" y="370.0" class="b" text-anchor="start" >.DN / Q</text><text x="24" y="390.0" class="s" text-anchor="start" >output</text><path d="M200 386H860" stroke="#4a5466" stroke-width="1" opacity=".6"/><path d="M200 96H260V60H460V96H500V60H560V96H860" fill="none" stroke="#a4b1cd" stroke-width="3.5" stroke-linejoin="round"/><path d="M200 206H460L500 186V206H560L680 146H860" fill="none" stroke="#07E9B4" stroke-width="3.5" stroke-linejoin="round"/><path d="M200 146H860" stroke="#f5b942" stroke-width="1.5" stroke-dasharray="6 5"/><text x="856" y="140" class="s" text-anchor="end" style="fill:#f5b942">PT</text><path d="M200 296H460V260H500V296H560V260H680V296H860" fill="none" stroke="#f5b942" stroke-width="3.5" stroke-linejoin="round"/><path d="M200 386H260V350H680V386H860" fill="none" stroke="#07E9B4" stroke-width="3.5" stroke-linejoin="round"/><text x="620" y="134" class="s" text-anchor="middle" style="fill:#f5b942">delay = PT</text><text x="480" y="236" class="s" text-anchor="middle" >input came back: reset</text><text x="460" y="418" class="s" text-anchor="middle" >1 · input drops, timing starts</text><text x="500" y="438" class="s" text-anchor="middle" >2 · input returns, timer resets</text><text x="700" y="418" class="s" text-anchor="start" >3 · ET = PT, DN off</text></svg>