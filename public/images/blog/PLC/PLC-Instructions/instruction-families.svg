<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t7 d7" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t7">Ladder instruction families</title><desc id="d7">Seven groups: bit, one-shot, timers, counters, compare, math and move.</desc><defs></defs><style>
text{font-family:'Segoe UI',Arial,sans-serif}
.h{font-size:18px;font-weight:700;fill:#cad2e2}
.b{font-size:15px;font-weight:700;fill:#cad2e2}
.s{font-size:13px;fill:#a4b1cd}
.m{font-size:14px;fill:#cad2e2}
.mn{font-size:11.5px;font-weight:700;letter-spacing:1.2px}
.mono{font-family:'Consolas','Courier New',monospace;font-size:15px;font-weight:700;fill:#cad2e2}
</style><rect width="900" height="420" rx="16" fill="#141d2b"/><rect x="20" y="20" width="205" height="170" rx="12" fill="#1a2331" stroke="#4a5466"/><rect x="20" y="20" width="6" height="170" rx="3" fill="#07E9B4"/><text x="44" y="62" class="h" text-anchor="start" style="fill:#07E9B4;font-size:20px">Bit</text><text x="44" y="86" class="s" text-anchor="start" >Read and write single bits</text><text x="44" y="128" class="mono" xml:space="preserve">XIC  XIO  OTE</text><text x="44" y="156" class="mono" xml:space="preserve">OTL  OTU</text><rect x="241" y="20" width="205" height="170" rx="12" fill="#1a2331" stroke="#4a5466"/><rect x="241" y="20" width="6" height="170" rx="3" fill="#f5b942"/><text x="265" y="62" class="h" text-anchor="start" style="fill:#f5b942;font-size:20px">One-shot</text><text x="265" y="86" class="s" text-anchor="start" >Act on one scan only</text><text x="265" y="128" class="mono" xml:space="preserve">ONS  OSR  OSF</text><rect x="462" y="20" width="205" height="170" rx="12" fill="#1a2331" stroke="#4a5466"/><rect x="462" y="20" width="6" height="170" rx="3" fill="#07E9B4"/><text x="486" y="62" class="h" text-anchor="start" style="fill:#07E9B4;font-size:20px">Timers</text><text x="486" y="86" class="s" text-anchor="start" >Add a time delay</text><text x="486" y="128" class="mono" xml:space="preserve">TON  TOF  RTO</text><rect x="683" y="20" width="205" height="170" rx="12" fill="#1a2331" stroke="#4a5466"/><rect x="683" y="20" width="6" height="170" rx="3" fill="#f5b942"/><text x="707" y="62" class="h" text-anchor="start" style="fill:#f5b942;font-size:20px">Counters</text><text x="707" y="86" class="s" text-anchor="start" >Count events</text><text x="707" y="128" class="mono" xml:space="preserve">CTU  CTD  RES</text><rect x="127" y="210" width="205" height="170" rx="12" fill="#1a2331" stroke="#4a5466"/><rect x="127" y="210" width="6" height="170" rx="3" fill="#07E9B4"/><text x="151" y="252" class="h" text-anchor="start" style="fill:#07E9B4;font-size:20px">Compare</text><text x="151" y="276" class="s" text-anchor="start" >Test numbers</text><text x="151" y="318" class="mono" xml:space="preserve">EQU  NEQ  GRT</text><text x="151" y="346" class="mono" xml:space="preserve">GEQ  LES  LEQ  LIM</text><rect x="348" y="210" width="205" height="170" rx="12" fill="#1a2331" stroke="#4a5466"/><rect x="348" y="210" width="6" height="170" rx="3" fill="#f5b942"/><text x="372" y="252" class="h" text-anchor="start" style="fill:#f5b942;font-size:20px">Math</text><text x="372" y="276" class="s" text-anchor="start" >Calculate values</text><text x="372" y="318" class="mono" xml:space="preserve">ADD  SUB  MUL</text><text x="372" y="346" class="mono" xml:space="preserve">DIV  CPT</text><rect x="569" y="210" width="205" height="170" rx="12" fill="#1a2331" stroke="#4a5466"/><rect x="569" y="210" width="6" height="170" rx="3" fill="#07E9B4"/><text x="593" y="252" class="h" text-anchor="start" style="fill:#07E9B4;font-size:20px">Move</text><text x="593" y="276" class="s" text-anchor="start" >Copy and clear data</text><text x="593" y="318" class="mono" xml:space="preserve">MOV  CLR</text><text x="450" y="404" class="s" text-anchor="middle" >Same ideas on every brand. Only the names change.</text></svg>