<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" role="img" aria-labelledby="t5 d5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t5">Count up counter timing</title><desc id="d5">A count input pulses six times. The accumulator counts 1 to 6. The done bit turns on when the accumulator reaches the preset of 5. A reset pulse clears the accumulator and the done bit.</desc><defs></defs><style>
text{font-family:'Segoe UI',Arial,sans-serif}
.h{font-size:18px;font-weight:700;fill:#cad2e2}
.b{font-size:15px;font-weight:700;fill:#cad2e2}
.s{font-size:13px;fill:#a4b1cd}
.m{font-size:14px;fill:#cad2e2}
.mn{font-size:11.5px;font-weight:700;letter-spacing:1.2px}
.mono{font-family:'Consolas','Courier New',monospace;font-size:15px;font-weight:700;fill:#cad2e2}
</style><rect width="900" height="452" rx="16" fill="#141d2b"/><path d="M530 30V390" stroke="#4a5466" stroke-width="1.5" stroke-dasharray="5 5"/><path d="M700 30V390" stroke="#4a5466" stroke-width="1.5" stroke-dasharray="5 5"/><text x="24" y="70" class="b" text-anchor="start" >Count input</text><text x="24" y="90" class="s" text-anchor="start" >off → on edges</text><path d="M190 90H210V64H238V90H290V64H318V90H370V64H398V90H450V64H478V90H530V64H558V90H610V64H638V90H860" fill="none" stroke="#a4b1cd" stroke-width="3.5" stroke-linejoin="round"/><text x="24" y="205" class="b" text-anchor="start" >ACC</text><text x="24" y="225" class="s" text-anchor="start" >accumulator</text><path d="M190 270H210V250H290V230H370V210H450V190H530V170H610V150H700V270H860" fill="none" stroke="#07E9B4" stroke-width="3.5" stroke-linejoin="round"/><path d="M190 170H860" stroke="#f5b942" stroke-width="1.5" stroke-dasharray="6 5"/><text x="856" y="162" class="s" text-anchor="end" style="fill:#f5b942">PRE = 5</text><text x="250.0" y="272" class="b" text-anchor="middle" >1</text><text x="330.0" y="252" class="b" text-anchor="middle" >2</text><text x="410.0" y="232" class="b" text-anchor="middle" >3</text><text x="490.0" y="212" class="b" text-anchor="middle" >4</text><text x="570.0" y="192" class="b" text-anchor="middle" >5</text><text x="655.0" y="142" class="b" text-anchor="middle" >6</text><text x="780" y="262" class="b" text-anchor="middle" >0</text><text x="24" y="312" class="b" text-anchor="start" >DN bit</text><text x="24" y="332" class="s" text-anchor="start" >done</text><path d="M190 326H530V300H700V326H860" fill="none" stroke="#f5b942" stroke-width="3.5" stroke-linejoin="round"/><text x="24" y="372" class="b" text-anchor="start" >Reset (RES)</text><text x="24" y="392" class="s" text-anchor="start" >clears the counter</text><path d="M190 386H700V360H740V386H860" fill="none" stroke="#a4b1cd" stroke-width="3.5" stroke-linejoin="round"/><text x="530" y="418" class="s" text-anchor="middle" >ACC reaches PRE: DN turns ON</text><text x="725" y="438" class="s" text-anchor="middle" >RES clears ACC and DN</text></svg>