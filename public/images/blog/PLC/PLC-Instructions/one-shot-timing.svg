304" class="s" text-anchor="middle" >each tick = one PLC scan</text><text x="24" y="76" class="b" text-anchor="start" >Input</text><text x="24" y="96" class="s" text-anchor="start" >held ON</text><path d="M200 96H860" stroke="#4a5466" stroke-width="1" opacity=".6"/><path d="M200 96H222V60H700V96H770V60H850V96H860" fill="none" stroke="#a4b1cd" stroke-width="3.5" stroke-linejoin="round"/><text x="24" y="176" class="b" text-anchor="start" >ONS output</text><text x="24" y="196" class="s" text-anchor="start" >one scan only</text><path d="M200 196H860" stroke="#4a5466" stroke-width="1" opacity=".6"/><path d="M200 196H222V160H244V196H770V160H792V196H860" fill="none" stroke="#f5b942" stroke-width="3.5" stroke-linejoin="round"/><text x="460" y="84" class="s" text-anchor="middle" >the rung stays TRUE the whole time</text><text x="258" y="184" class="s" text-anchor="start" >TRUE for one scan, then FALSE</text><text x="812" y="184" class="s" text-anchor="start" >again</text></svg>