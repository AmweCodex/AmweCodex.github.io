<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="t4 d4" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t4">One-shot instruction timing</title><desc id="d4">An input held ON for many scans. Without ONS the rung is true the whole time. With ONS the output is true for only one scan each time the input turns on.</desc><defs></defs><style>
