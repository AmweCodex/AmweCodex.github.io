<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" role="img" aria-labelledby="t3 d3" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t3">Sourcing versus sinking wiring</title>
<desc id="d3">Left: a PNP sensor sources current into a sinking PLC input. Right: an NPN sensor sinks current from a sourcing PLC input.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#07E9B4"/></marker>
</defs>
<style>
text{font-family:'Segoe UI',Arial,sans-serif}
.h{font-size:18px;font-weight:700;fill:#cad2e2}
.s{fill:#a4b1cd;font-size:13px}
.b{fill:#cad2e2;font-size:15px;font-weight:700}
.r{font-size:14px;font-weight:700}
</style>
<rect width="800" height="410" rx="16" fill="#141d2b"/>
<rect x="20" y="20" width="370" height="370" rx="12" fill="#1a2331" stroke="#4a5466"/>
<rect x="410" y="20" width="370" height="370" rx="12" fill="#1a2331" stroke="#4a5466"/>

<!-- LEFT: PNP -> sinking input -->
<text x="205" y="50" class="h" text-anchor="middle">PNP sensor = sourcing</text>
<text x="205" y="70" class="s" text-anchor="middle">pairs with a sinking input card</text>
<path d="M60 105H350" stroke="#ec0725" stroke-width="3"/><text x="60" y="97" class="r" fill="#ec0725">+24V</text>
<path d="M60 325H350" stroke="#a4b1cd" stroke-width="3"/><text x="60" y="345" class="r" fill="#a4b1cd">0V</text>
<path d="M205 105V130" stroke="#07E9B4" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="120" y="132" width="170" height="60" rx="10" fill="#141d2b" stroke="#07E9B4" stroke-width="2"/>
<text x="205" y="158" class="b" text-anchor="middle">PNP sensor</text><text x="205" y="177" class="s" text-anchor="middle">switches +24V out</text>
<path d="M205 192V236" stroke="#07E9B4" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="120" y="238" width="170" height="60" rx="10" fill="#141d2b" stroke="#4a5466" stroke-width="2"/>
<text x="205" y="264" class="b" text-anchor="middle">PLC input</text><text x="205" y="283" class="s" text-anchor="middle">current flows in</text>
<path d="M205 298V323" stroke="#07E9B4" stroke-width="2.5" marker-end="url(#a)"/>
<text x="205" y="372" class="s" text-anchor="middle">+24V → sensor → input → 0V</text>

<!-- RIGHT: NPN -> sourcing input -->
<text x="595" y="50" class="h" text-anchor="middle">NPN sensor = sinking</text>
<text x="595" y="70" class="s" text-anchor="middle">pairs with a sourcing input card</text>
<path d="M450 105H740" stroke="#ec0725" stroke-width="3"/><text x="450" y="97" class="r" fill="#ec0725">+24V</text>
<path d="M450 325H740" stroke="#a4b1cd" stroke-width="3"/><text x="450" y="345" class="r" fill="#a4b1cd">0V</text>
<path d="M595 105V130" stroke="#07E9B4" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="510" y="132" width="170" height="60" rx="10" fill="#141d2b" stroke="#4a5466" stroke-width="2"/>
<text x="595" y="158" class="b" text-anchor="middle">PLC input</text><text x="595" y="177" class="s" text-anchor="middle">supplies +24V</text>
<path d="M595 192V236" stroke="#07E9B4" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="510" y="238" width="170" height="60" rx="10" fill="#141d2b" stroke="#07E9B4" stroke-width="2"/>
<text x="595" y="264" class="b" text-anchor="middle">NPN sensor</text><text x="595" y="283" class="s" text-anchor="middle">switches to 0V</text>
<path d="M595 298V323" stroke="#07E9B4" stroke-width="2.5" marker-end="url(#a)"/>
<text x="595" y="372" class="s" text-anchor="middle">+24V → input → sensor → 0V</text>
</svg>
