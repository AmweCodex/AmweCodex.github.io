<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="t1 d1" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t1">Digital versus analog signals</title>
<desc id="d1">A square wave that only jumps between 0 volts and 24 volts, next to a smooth curve that can take any value.</desc>
<style>
text{font-family:'Segoe UI',Arial,sans-serif}
.h{font-size:20px;font-weight:700}
.s{fill:#a4b1cd;font-size:14px}
.l{fill:#a4b1cd;font-size:13px}
.ax{stroke:#4a5466;stroke-width:1.5;fill:none}
.gr{stroke:#4a5466;stroke-width:1;stroke-dasharray:4 5;opacity:.7}
</style>
<rect width="800" height="340" rx="16" fill="#141d2b"/>
<rect x="20" y="20" width="370" height="300" rx="12" fill="#1a2331" stroke="#4a5466"/>
<rect x="410" y="20" width="370" height="300" rx="12" fill="#1a2331" stroke="#4a5466"/>

<text x="40" y="52" class="h" fill="#07E9B4">Digital (discrete)</text>
<text x="40" y="74" class="s">Only two states: OFF or ON</text>
<line class="gr" x1="90" y1="120" x2="370" y2="120"/>
<line class="gr" x1="90" y1="250" x2="370" y2="250"/>
<path class="ax" d="M90 100V270H370"/>
<path d="M90 250H140V120H220V250H270V120H340V250H370" fill="none" stroke="#07E9B4" stroke-width="4" stroke-linejoin="round"/>
<text x="80" y="124" class="l" text-anchor="end">24V</text>
<text x="80" y="254" class="l" text-anchor="end">0V</text>
<text x="230" y="302" class="s" text-anchor="middle">ON = 1   ·   OFF = 0</text>

<text x="430" y="52" class="h" fill="#f5b942">Analog (continuous)</text>
<text x="430" y="74" class="s">Any value inside a range</text>
<line class="gr" x1="480" y1="120" x2="760" y2="120"/>
<line class="gr" x1="480" y1="250" x2="760" y2="250"/>
<path class="ax" d="M480 100V270H760"/>
<path d="M480 240C520 120 560 120 600 190S680 280 720 180C736 150 748 138 760 130" fill="none" stroke="#f5b942" stroke-width="4" stroke-linecap="round"/>
<text x="470" y="124" class="l" text-anchor="end">max</text>
<text x="470" y="254" class="l" text-anchor="end">min</text>
<text x="620" y="302" class="s" text-anchor="middle">Every value in between is possible</text>
</svg>
