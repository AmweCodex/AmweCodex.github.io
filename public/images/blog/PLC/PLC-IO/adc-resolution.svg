<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" role="img" aria-labelledby="t5 d5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t5">ADC resolution: coarse versus fine</title>
<desc id="d5">A smooth ramp signal measured with 3-bit resolution looks like a few big steps. With 12-bit resolution the steps are so small it follows the signal closely.</desc>
<style>
text{font-family:'Segoe UI',Arial,sans-serif}
.h{font-size:18px;font-weight:700}
.s{fill:#a4b1cd;font-size:13.5px}
.ax{stroke:#4a5466;stroke-width:1.5;fill:none}
</style>
<rect width="800" height="350" rx="16" fill="#141d2b"/>
<rect x="20" y="20" width="370" height="310" rx="12" fill="#1a2331" stroke="#4a5466"/>
<rect x="410" y="20" width="370" height="310" rx="12" fill="#1a2331" stroke="#4a5466"/>
<text x="40" y="52" class="h" fill="#f5b942">3-bit: 8 steps</text>
<text x="40" y="72" class="s">Coarse. Small changes get missed.</text>
<path class="ax" d="M60 90V270H370"/>
<path d="M60 270L360 80" stroke="#a4b1cd" stroke-width="1.5" stroke-dasharray="5 5" fill="none"/>
<path d="M60.0 270.0 V270.0 H97.5 V242.9 H135.0 V215.7 H172.5 V188.6 H210.0 V161.4 H247.5 V134.3 H285.0 V107.1 H322.5 V80.0 H360.0" fill="none" stroke="#f5b942" stroke-width="3.5" stroke-linejoin="round"/>
<text x="205" y="304" class="s" text-anchor="middle">dashed = real signal · solid = PLC reading</text>
<text x="430" y="52" class="h" fill="#07E9B4">12-bit: 4096 steps</text>
<text x="430" y="72" class="s">Fine. Follows the signal closely.</text>
<path class="ax" d="M450 90V270H760"/>
<path d="M450 270L750 80" stroke="#a4b1cd" stroke-width="1.5" stroke-dasharray="5 5" fill="none"/>
<path d="M450.0 270.0 V270.0 H456.2 V266.0 H462.5 V261.9 H468.8 V257.9 H475.0 V253.8 H481.2 V249.8 H487.5 V245.7 H493.8 V241.7 H500.0 V237.7 H506.2 V233.6 H512.5 V229.6 H518.8 V225.5 H525.0 V221.5 H531.2 V217.4 H537.5 V213.4 H543.8 V209.4 H550.0 V205.3 H556.2 V201.3 H562.5 V197.2 H568.8 V193.2 H575.0 V189.1 H581.2 V185.1 H587.5 V181.1 H593.8 V177.0 H600.0 V173.0 H606.2 V168.9 H612.5 V164.9 H618.8 V160.9 H625.0 V156.8 H631.2 V152.8 H637.5 V148.7 H643.8 V144.7 H650.0 V140.6 H656.2 V136.6 H662.5 V132.6 H668.8 V128.5 H675.0 V124.5 H681.2 V120.4 H687.5 V116.4 H693.8 V112.3 H700.0 V108.3 H706.2 V104.3 H712.5 V100.2 H718.8 V96.2 H725.0 V92.1 H731.2 V88.1 H737.5 V84.0 H743.8 V80.0 H750.0" fill="none" stroke="#07E9B4" stroke-width="3" stroke-linejoin="round"/>
<text x="595" y="304" class="s" text-anchor="middle">(steps drawn larger than real, to show the idea)</text>
</svg>