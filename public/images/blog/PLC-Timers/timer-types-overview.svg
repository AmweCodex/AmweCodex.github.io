<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="t1 d1" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t1">The four timer types at a glance</title><desc id="d1">Mini timing diagrams for TON, TOF, TP and RTO showing how the output Q reacts to the input IN.</desc><defs></defs><style>
text{font-family:'Segoe UI',Arial,sans-serif}
.h{font-size:18px;font-weight:700;fill:#cad2e2}
.b{font-size:15px;font-weight:700;fill:#cad2e2}
.s{font-size:13px;fill:#a4b1cd}
.m{font-size:14px;fill:#cad2e2}
.mn{font-size:11.5px;font-weight:700;letter-spacing:1.2px}
.mono{font-family:'Consolas','Courier New',monospace;font-size:15px;font-weight:700;fill:#cad2e2}
</style><rect width="900" height="320" rx="16" fill="#141d2b"/><rect x="20" y="20" width="205" height="280" rx="12" fill="#1a2331" stroke="#4a5466"/><text x="40" y="60" class="h" text-anchor="start" style="fill:#07E9B4;font-size:24px">TON</text><text x="34" y="128" class="s" text-anchor="start" >IN</text><path d="M60 132H212" stroke="#4a5466" stroke-width="1" opacity=".6"/><path d="M60 132H90V108H170V132H190V108H208V132H212" fill="none" stroke="#a4b1cd" stroke-width="3" stroke-linejoin="round"/><text x="34" y="206" class="s" text-anchor="start" >Q</text><path d="M60 210H212" stroke="#4a5466" stroke-width="1" opacity=".6"/><path d="M60 210H125V186H170V210H212" fill="none" stroke="#07E9B4" stroke-width="3" stroke-linejoin="round"/><text x="40" y="258" class="b" text-anchor="start" >Delays turning ON</text><text x="40" y="280" class="s" text-anchor="start" >Output waits for the delay</text><rect x="241" y="20" width="205" height="280" rx="12" fill="#1a2331" stroke="#4a5466"/><text x="261" y="60" class="h" text-anchor="start" style="fill:#f5b942;font-size:24px">TOF</text><text x="255" y="128" class="s" text-anchor="start" >IN</text><path d="M281 132H433" stroke="#4a5466" stroke-width="1" opacity=".6"/><path d="M281 132H311V108H371V132H433" fill="none" stroke="#a4b1cd" stroke-width="3" stroke-linejoin="round"/><text x="255" y="206" class="s" text-anchor="start" >Q</text><path d="M281 210H433" stroke="#4a5466" stroke-width="1" opacity=".6"/><path d="M281 210H311V186H406V210H433" fill="none" stroke="#f5b942" stroke-width="3" stroke-linejoin="round"/><text x="261" y="258" class="b" text-anchor="start" >Delays turning OFF</text><text x="261" y="280" class="s" text-anchor="start" >Output stays on a bit longer</text><rect x="462" y="20" width="205" height="280" rx="12" fill="#1a2331" stroke="#4a5466"/><text x="482" y="60" class="h" text-anchor="start" style="fill:#07E9B4;font-size:24px">TP</text><text x="476" y="128" class="s" text-anchor="start" >IN</text><path d="M502 132H654" stroke="#4a5466" stroke-width="1" opacity=".6"/><path d="M502 132H527V108H592V132H607V108H627V132H654" fill="none" stroke="#a4b1cd" stroke-width="3" stroke-linejoin="round"/><text x="476" y="206" class="s" text-anchor="start" >Q</text><path d="M502 210H654" stroke="#4a5466" stroke-width="1" opacity=".6"/><path d="M502 210H527V186H562V210H607V186H642V210H654" fill="none" stroke="#07E9B4" stroke-width="3" stroke-linejoin="round"/><text x="482" y="258" class="b" text-anchor="start" >Fixed-length pulse</text><text x="482" y="280" class="s" text-anchor="start" >Input length is ignored</text><rect x="683" y="20" width="205" height="280" rx="12" fill="#1a2331" stroke="#4a5466"/><text x="703" y="60" class="h" text-anchor="start" style="fill:#f5b942;font-size:24px">RTO</text><text x="697" y="128" class="s" text-anchor="start" >IN</text><path d="M723 132H875" stroke="#4a5466" stroke-width="1" opacity=".6"/><path d="M723 132H753V108H793V132H818V108H848V132H875" fill="none" stroke="#a4b1cd" stroke-width="3" stroke-linejoin="round"/><text x="697" y="206" class="s" text-anchor="start" >Q</text><path d="M723 210H875" stroke="#4a5466" stroke-width="1" opacity=".6"/><path d="M723 210H828V186H873V210H875" fill="none" stroke="#f5b942" stroke-width="3" stroke-linejoin="round"/><text x="703" y="258" class="b" text-anchor="start" >Remembers its time</text><text x="703" y="280" class="s" text-anchor="start" >Needs a reset to clear</text></svg>