<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="t6 d6" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t6">Real-world uses for each timer</title><desc id="d6">Four examples: a conveyor start delay with TON, a cooling fan run-on with TOF, a door strike pulse with TP and a pump runtime counter with RTO.</desc><defs></defs><style>
text{font-family:'Segoe UI',Arial,sans-serif}
.h{font-size:18px;font-weight:700;fill:#cad2e2}
.b{font-size:15px;font-weight:700;fill:#cad2e2}
.s{font-size:13px;fill:#a4b1cd}
.m{font-size:14px;fill:#cad2e2}
.mn{font-size:11.5px;font-weight:700;letter-spacing:1.2px}
.mono{font-family:'Consolas','Courier New',monospace;font-size:15px;font-weight:700;fill:#cad2e2}
</style><rect width="900" height="340" rx="16" fill="#141d2b"/><rect x="20" y="20" width="420" height="130" rx="12" fill="#1a2331" stroke="#4a5466"/><rect x="20" y="20" width="6" height="130" rx="3" fill="#07E9B4"/><text x="48" y="66" class="h" text-anchor="start" style="fill:#07E9B4;font-size:26px">TON</text><text x="138" y="66" class="b" text-anchor="start" >Conveyor start delay</text><text x="48" y="106" class="s" text-anchor="start" >Horn sounds, then the conveyor starts 5 seconds later.</text><rect x="460" y="20" width="420" height="130" rx="12" fill="#1a2331" stroke="#4a5466"/><rect x="460" y="20" width="6" height="130" rx="3" fill="#f5b942"/><text x="488" y="66" class="h" text-anchor="start" style="fill:#f5b942;font-size:26px">TOF</text><text x="578" y="66" class="b" text-anchor="start" >Cooling fan run-on</text><text x="488" y="106" class="s" text-anchor="start" >Motor stops, the fan keeps running for 30 more seconds.</text><rect x="20" y="170" width="420" height="130" rx="12" fill="#1a2331" stroke="#4a5466"/><rect x="20" y="170" width="6" height="130" rx="3" fill="#07E9B4"/><text x="48" y="216" class="h" text-anchor="start" style="fill:#07E9B4;font-size:26px">TP</text><text x="138" y="216" class="b" text-anchor="start" >Door strike pulse</text><text x="48" y="256" class="s" text-anchor="start" >Each press unlocks the door for exactly 3 seconds.</text><rect x="460" y="170" width="420" height="130" rx="12" fill="#1a2331" stroke="#4a5466"/><rect x="460" y="170" width="6" height="130" rx="3" fill="#f5b942"/><text x="488" y="216" class="h" text-anchor="start" style="fill:#f5b942;font-size:26px">RTO</text><text x="578" y="216" class="b" text-anchor="start" >Pump run hours</text><text x="488" y="256" class="s" text-anchor="start" >Adds up total running time, even across many stops.</text></svg>