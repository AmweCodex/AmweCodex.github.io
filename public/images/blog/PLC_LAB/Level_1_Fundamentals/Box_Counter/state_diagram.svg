<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#07E9B4"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f5b942"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5466"/></marker></defs>
<rect width="900" height="360" rx="16" fill="#141d2b"/>
<text x="450" y="40" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#cad2e2" >State diagram</text>
<rect x="40" y="120" width="220" height="100" rx="10" fill="#1a2331" stroke="#4a5466" stroke-width="2"/>
<text x="150" y="165" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="20" font-weight="bold" fill="#cad2e2" >IDLE</text>
<text x="150" y="192" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#a4b1cd" >Motor OFF · count kept</text>
<rect x="340" y="120" width="220" height="100" rx="10" fill="#1a2331" stroke="#07E9B4" stroke-width="2.5"/>
<text x="450" y="165" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="20" font-weight="bold" fill="#07E9B4" >RUNNING</text>
<text x="450" y="192" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#a4b1cd" >Motor ON · counting boxes</text>
<rect x="640" y="120" width="220" height="100" rx="10" fill="#1a2331" stroke="#4a5466" stroke-width="2"/>
<text x="750" y="165" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#cad2e2" >BATCH COMPLETE</text>
<text x="750" y="192" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#a4b1cd" >Motor OFF · DN on</text>
<line x1="260" y1="160" x2="340" y2="160" stroke="#07E9B4" stroke-width="2.5" marker-end="url(#a)"/>
<text x="300" y="150" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#07E9B4" >START</text>
<line x1="560" y1="160" x2="640" y2="160" stroke="#07E9B4" stroke-width="2.5" marker-end="url(#a)"/>
<text x="600" y="150" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#07E9B4" >count = 5</text>
<path d="M450,220 L450,285 L150,285 L150,220" fill="none" stroke="#f5b942" stroke-width="2.5" marker-end="url(#am)"/>
<text x="300" y="308" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#f5b942" >STOP pressed (count is kept)</text>
<path d="M750,120 L750,80 L150,80 L150,120" fill="none" stroke="#07E9B4" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="450" y="72" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#07E9B4" >RESET (count cleared)</text>
<text x="750" y="245" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#a4b1cd" >START pressed: ignored</text>
</svg>
