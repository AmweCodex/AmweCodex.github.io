<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#07E9B4"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f5b942"/></marker></defs>
<rect width="900" height="330" rx="16" fill="#141d2b"/>
<text x="450" y="40" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#cad2e2" >State diagram</text>
<rect x="90" y="110" width="240" height="100" rx="10" fill="#1a2331" stroke="#4a5466" stroke-width="2"/>
<text x="210" y="155" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="20" font-weight="bold" fill="#cad2e2" >IDLE</text>
<text x="210" y="182" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#a4b1cd" >Motor OFF · timer reset</text>
<rect x="570" y="110" width="240" height="100" rx="10" fill="#1a2331" stroke="#07E9B4" stroke-width="2.5"/>
<text x="690" y="155" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="20" font-weight="bold" fill="#07E9B4" >RUNNING</text>
<text x="690" y="182" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#a4b1cd" >Motor ON · timer counting</text>
<line x1="330" y1="145" x2="570" y2="145" stroke="#07E9B4" stroke-width="2.5" marker-end="url(#a)"/>
<text x="450" y="134" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#07E9B4" >START pressed</text>
<path d="M690,110 L690,75 L210,75 L210,110" fill="none" stroke="#07E9B4" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="450" y="68" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#07E9B4" >10 s timer done</text>
<path d="M690,210 L690,262 L210,262 L210,210" fill="none" stroke="#f5b942" stroke-width="2.5" marker-end="url(#am)"/>
<text x="450" y="284" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#f5b942" >STOP pressed (early stop)</text>
<text x="690" y="236" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#a4b1cd" >START pressed again: ignored</text>
</svg>
