<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-label="State diagram" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>State diagram</title><defs><marker id="m1" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,1 L13,7 L0,13 z" fill="#07E9B4"/></marker><marker id="m2" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,1 L13,7 L0,13 z" fill="#f5b942"/></marker></defs><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#07E9B4"/></marker><marker id="aa" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f5b942"/></marker></defs><rect width="900" height="380" rx="16" fill="#141d2b"/><text x="450" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#cad2e2" text-anchor="middle" font-weight="bold">State diagram</text><circle cx="190" cy="210" r="82" fill="#1a2331" stroke="#4a5466" stroke-width="3"/><text x="190" y="206" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#cad2e2" text-anchor="middle" font-weight="bold">STOPPED</text><text x="190" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#a4b1cd" text-anchor="middle" font-weight="normal">motor OFF, lamp OFF</text><circle cx="710" cy="210" r="82" fill="#1a2331" stroke="#07E9B4" stroke-width="3"/><text x="710" y="206" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#07E9B4" text-anchor="middle" font-weight="bold">RUNNING</text><text x="710" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#a4b1cd" text-anchor="middle" font-weight="normal">motor ON, lamp ON</text><line x1="276" y1="185" x2="622" y2="185" stroke="#07E9B4" stroke-width="2.5" marker-end="url(#m1)"/><text x="449" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#07E9B4" text-anchor="middle" font-weight="bold">START pressed</text><line x1="624" y1="238" x2="278" y2="238" stroke="#f5b942" stroke-width="2.5" marker-end="url(#m2)"/><text x="449" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#f5b942" text-anchor="middle" font-weight="bold">STOP pressed</text><text x="449" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#a4b1cd" text-anchor="middle" font-weight="normal">The lamp always has the same state as the motor.</text></svg>