<text x="640" y="260" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#f5b942" >5 s timeout, or both limits on</text>
<path d="M350,335 L140,335 L140,220" fill="none" stroke="#07E9B4" stroke-width="2.5" marker-end="url(#a)"/>
<text x="245" y="358" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#07E9B4" >RESET</text>
