<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#07E9B4"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f5b942"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5466"/></marker></defs>
<rect width="900" height="400" rx="16" fill="#141d2b"/>
<text x="450" y="40" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#cad2e2" >State diagram</text>
<rect x="40" y="130" width="200" height="90" rx="10" fill="#1a2331" stroke="#4a5466" stroke-width="2"/>
<text x="140" y="168" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="20" font-weight="bold" fill="#cad2e2" >IDLE</text>
<text x="140" y="196" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#a4b1cd" >Cylinder at home</text>
<rect x="350" y="130" width="200" height="90" rx="10" fill="#1a2331" stroke="#07E9B4" stroke-width="2.5"/>
<text x="450" y="168" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#07E9B4" >EXTENDING</text>
<text x="450" y="196" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#a4b1cd" >Extend solenoid ON</text>
<rect x="660" y="130" width="200" height="90" rx="10" fill="#1a2331" stroke="#07E9B4" stroke-width="2.5"/>
<text x="760" y="168" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#07E9B4" >RETRACTING</text>
<text x="760" y="196" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#a4b1cd" >Retract solenoid ON</text>
<rect x="350" y="300" width="200" height="70" rx="10" fill="#1a2331" stroke="#f5b942" stroke-width="2.5"/>
<text x="450" y="332" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#f5b942" >FAULT</text>
<text x="450" y="356" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#a4b1cd" >Both solenoids OFF</text>
<line x1="240" y1="175" x2="350" y2="175" stroke="#07E9B4" stroke-width="2.5" marker-end="url(#a)"/>
