<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#07E9B4"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f5b942"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5466"/></marker></defs>
<rect width="900" height="340" rx="16" fill="#141d2b"/>
<text x="450" y="40" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#cad2e2" >State diagram</text>
<rect x="110" y="115" width="260" height="100" rx="10" fill="#1a2331" stroke="#4a5466" stroke-width="2"/>
<text x="240" y="160" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="20" font-weight="bold" fill="#cad2e2" >IDLE</text>
<text x="240" y="187" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#a4b1cd" >Pump OFF</text>
<rect x="530" y="115" width="260" height="100" rx="10" fill="#1a2331" stroke="#07E9B4" stroke-width="2.5"/>
<text x="660" y="160" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="20" font-weight="bold" fill="#07E9B4" >FILLING</text>
<text x="660" y="187" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#a4b1cd" >Pump ON · sealed in</text>
<line x1="370" y1="150" x2="530" y2="150" stroke="#07E9B4" stroke-width="2.5" marker-end="url(#a)"/>
<text x="450" y="140" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#07E9B4" >START (HIGH not active)</text>
<path d="M660,115 L660,75 L240,75 L240,115" fill="none" stroke="#07E9B4" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="450" y="68" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#07E9B4" >HIGH level active</text>
<path d="M660,215 L660,265 L240,265 L240,215" fill="none" stroke="#f5b942" stroke-width="2.5" marker-end="url(#am)"/>
<text x="450" y="288" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#f5b942" >STOP pressed</text>
<text x="240" y="240" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#a4b1cd" >START with HIGH active: ignored</text>
<text x="450" y="322" text-anchor="middle" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#a4b1cd" >The LOW lamp follows the LOW switch in every state</text>
